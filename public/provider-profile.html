  <script src="js/categories.js"></script>
  <script>
    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      if (me.role !== 'provider') { window.location.href = '/dashboard.html'; return; }
      const refreshNotifications = initNotificationBell();
      setInterval(() => refreshNotifications(), 20000);
      refreshOnResume(() => refreshNotifications());

      const provRes = await fetch('/api/provider/me');
      if (provRes.ok) {
        const p = (await provRes.json()).provider;
        document.getElementById('profileName').textContent = p.name;
        document.getElementById('profileMeta').textContent = `${p.category} · ${p.location}`;
        document.getElementById('profileAvatar').innerHTML = p.photo ? `<img class="avatar-img" src="${p.photo}" alt="">` : initials(p.name);
      }

      const verRes = await fetch('/api/provider/verification-status');
      if (verRes.ok) {
        const v = await verRes.json();
        if (v.approvalStatus !== 'APPROVED') {
          const banner = document.getElementById('approvalBanner');
          const msgs = {
            PENDING: { bg: 'var(--primary-tint)', color: 'var(--primary-deep)', text: '⏳ Your application is under review.' },
            REJECTED: { bg: '#FEE2E2', color: '#B91C1C', text: '✗ Your application was not approved.' },
            SUSPENDED: { bg: '#F3F4F6', color: '#6B7280', text: '⚠ Your account is currently suspended.' }
          };
          const m = msgs[v.approvalStatus] || msgs.PENDING;
          banner.style.display = 'block';
          banner.style.background = m.bg;
          banner.style.color = m.color;
          banner.textContent = m.text;
        }
        const verifiedCount = v.services.filter(s => s.verification_status === 'VERIFIED').length;
        document.getElementById('verifSummary').textContent = `${verifiedCount}/${v.services.length} verified`;
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });
  </script>
