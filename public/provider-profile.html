<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your listing — HandyLink Pro</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body has-bottom-nav">
  <div class="app-shell">
    <nav class="sidebar-nav">
      <a href="/provider-dashboard.html" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo"><span class="pro-badge">PRO</span></a>
      <a href="/provider-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/></svg>Jobs</a>
      <a href="/provider-my-jobs.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>My Jobs</a>
      <a href="/provider-earnings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Earnings</a>
      <a href="/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>Messages</a>
      <a href="/provider-profile.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
    </nav>

    <div class="app-main">
      <div class="dash-wrap">
        <header class="dash-header">
          <h1 style="font-size:1.4rem; font-weight:800; margin:0;">Your listing</h1>
          <button id="logoutBtn" class="small-btn logout-btn">Log out</button>
        </header>

        <p class="job-meta" style="margin:-0.5rem 0 1.5rem;" id="welcome"></p>

        <div class="provider-layout">
          <form id="editForm" class="provider-form">
            <div class="error" id="error"></div>

            <div class="photo-upload-row">
              <div class="photo-preview" id="photoPreview">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </div>
              <label class="photo-upload-label" for="photoInput">Change photo</label>
              <input type="file" id="photoInput" accept="image/*" style="display:none;">
            </div>

            <label>Full name</label>
            <input type="text" id="name" required>

            <label>Category</label>
            <input type="text" id="category" required>

            <label>Location / area you serve</label>
            <input type="text" id="location" required>
            <button type="button" id="useLocationBtn" class="btn-outline" style="margin-top:-0.5rem; margin-bottom:1rem; font-size:0.85rem; padding:0.5rem 0.9rem;">
              <span id="useLocationLabel">📍 Use my current location</span>
            </button>

            <label>Phone number</label>
            <input type="tel" id="phone" required>

            <label>Bio</label>
            <textarea id="bio" rows="4"></textarea>

            <button type="submit">Save changes</button>
          </form>

          <div class="preview-col">
            <span class="preview-label">Live preview</span>
            <div class="live-badge"><span class="live-dot"></span>Visible to clients now</div>
            <div class="worker-card" id="previewCard"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/provider-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/></svg>Jobs</a>
    <a href="/provider-my-jobs.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>My Jobs</a>
    <a href="/provider-earnings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Earnings</a>
    <a href="/messages.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>Messages</a>
    <a href="/provider-profile.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <script src="js/categories.js"></script>
  <script>
    let currentPhoto = null;
    let pendingLat = null;
    let pendingLng = null;

    document.getElementById('useLocationBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        showToast('Your browser doesn\u2019t support location.', 'error');
        return;
      }
      document.getElementById('useLocationLabel').textContent = 'Getting your location...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          pendingLat = pos.coords.latitude;
          pendingLng = pos.coords.longitude;
          document.getElementById('useLocationLabel').textContent = '✓ Location set — save to apply';
          showToast('Location captured. Save changes to apply it.', 'success');
        },
        (err) => {
          document.getElementById('useLocationLabel').textContent = '📍 Use my current location';
          showToast('Couldn\u2019t get your location. Check permissions.', 'error');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
    let pendingPhoto = null;

    function renderPreview(p) {
      const color = categoryColor(p.category);
      const card = document.getElementById('previewCard');
      card.style.setProperty('--cat-color', color);
      const avatarHtml = (pendingPhoto || p.photo)
        ? `<img class="avatar-img" src="${pendingPhoto || p.photo}" alt="">`
        : initials(p.name);
      card.innerHTML = `
        <div class="worker-head">
          <div class="avatar">${avatarHtml}</div>
          <div class="worker-name-block">
            <strong>${escapeHtml(p.name) || 'Your name'}</strong>
            <span class="worker-cat"><svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2">${categoryIcon(p.category)}</svg>${escapeHtml(p.category) || 'Category'}</span>
          </div>
          <span class="rating"><span class="star">★</span> ${p.rating || '5.0'}</span>
        </div>
        <p class="location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          ${escapeHtml(p.location) || 'Location'}
        </p>
        <p class="bio">${escapeHtml(p.bio) || 'Your bio will appear here.'}</p>
        <button class="small-btn contact-btn" disabled>Contact ${escapeHtml(p.phone) || ''}</button>
      `;
    }

    document.getElementById('photoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        pendingPhoto = await compressImageFile(file, 320, 0.75);
        document.getElementById('photoPreview').innerHTML = `<img src="${pendingPhoto}" alt="">`;
        renderPreview(fieldsFromForm());
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    function fieldsFromForm() {
      return {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        location: document.getElementById('location').value,
        phone: document.getElementById('phone').value,
        bio: document.getElementById('bio').value,
        photo: currentPhoto
      };
    }

    ['name', 'category', 'location', 'phone', 'bio'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => renderPreview(fieldsFromForm()));
    });

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const payload = fieldsFromForm();
      if (pendingPhoto) payload.photo = pendingPhoto;
      else delete payload.photo;
      if (pendingLat !== null && pendingLng !== null) {
        payload.latitude = pendingLat;
        payload.longitude = pendingLng;
      }

      const res = await fetch('/api/provider/me', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }
      pendingPhoto = null;
      currentPhoto = data.provider.photo;
      if (pendingLat !== null) {
        document.getElementById('useLocationLabel').textContent = '📍 Use my current location';
        pendingLat = null;
        pendingLng = null;
      }
      showToast('Listing saved.', 'success');
      renderPreview(data.provider);
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    (async () => {
      const meRes = await fetch('/api/me');
      if (!meRes.ok) { window.location.href = '/login.html'; return; }
      const me = await meRes.json();
      if (me.role !== 'provider') { window.location.href = '/dashboard.html'; return; }
      document.getElementById('welcome').textContent = me.email;

      const provRes = await fetch('/api/provider/me');
      const provData = await provRes.json();
      if (provRes.ok) {
        const p = provData.provider;
        document.getElementById('name').value = p.name;
        document.getElementById('category').value = p.category;
        document.getElementById('location').value = p.location;
        document.getElementById('phone').value = p.phone;
        document.getElementById('bio').value = p.bio;
        currentPhoto = p.photo;
        if (p.photo) document.getElementById('photoPreview').innerHTML = `<img src="${p.photo}" alt="">`;
        renderPreview(p);
      }
    })();
  </script>
</body>
</html>
