<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Information — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="dash-wrap" style="max-width:480px;">
    <a href="/profile.html" class="chat-back" style="margin-bottom:1rem;" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <h1 style="font-size:1.3rem; font-weight:800; margin-bottom:1.25rem;">Personal Information</h1>

    <form id="editForm" class="provider-form">
      <div class="error" id="error"></div>
      <div class="success" id="success"></div>

      <label>Full name</label>
      <input type="text" id="name" required>

      <label>Phone number</label>
      <input type="tel" id="phone" required>

      <label>Email</label>
      <input type="email" id="email" disabled style="opacity:0.6;">

      <button type="submit">Save changes</button>
    </form>
  </div>

  <script src="js/categories.js"></script>
  <script>
    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      document.getElementById('name').value = me.name || '';
      document.getElementById('phone').value = me.phone || '';
      document.getElementById('email').value = me.email;
    })();

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      errorEl.textContent = ''; successEl.textContent = '';

      const res = await fetch('/api/me', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: document.getElementById('name').value, phone: document.getElementById('phone').value })
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error; return; }
      successEl.textContent = 'Saved.';
      showToast('Profile updated.', 'success');
    });
  </script>
</body>
</html>
