<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
  <div class="card">
    <div class="card-body">
      <a href="/index.html" class="back-arrow" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>

      <a href="/index.html" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo"></a>

      <h1>Welcome back!</h1>
      <p class="subtext">Sign in to your account</p>

      <div class="role-toggle" id="accountToggle" style="grid-template-columns: 1fr 1fr;">
        <button type="button" class="role-btn active" data-role="client" style="align-items:center; text-align:center;">
          <strong>Customer</strong>
        </button>
        <button type="button" class="role-btn" data-role="provider" style="align-items:center; text-align:center;">
          <strong>Worker</strong>
        </button>
      </div>

      <div class="error" id="error"></div>

      <form id="loginForm">
        <div class="input-icon-wrap">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
          <input type="email" id="email" placeholder="Email or phone number" required>
        </div>

        <div class="input-icon-wrap">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="10" width="15" height="10.5" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="14.8" r="1.3" fill="currentColor" stroke="none"/><path d="M12 16.1v1.6" stroke-width="2"/></svg>
          <input type="password" id="password" placeholder="Password" required>
          <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="form-row-between">
          <label class="remember-check">
            <input type="checkbox" id="remember">
            Remember me
          </label>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit">Sign in</button>
      </form>

      <div class="divider">or</div>

      <div class="social-row">
        <div id="googleBtnReal" style="width:100%; display:none;"></div>
        <button type="button" class="social-btn" id="googleBtn" style="flex:1;">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A10.99 10.99 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.04H2.18a11 11 0 0 0 0 9.92l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a10.99 10.99 0 0 0-9.82 6.04l3.66 2.85c.87-2.6 3.3-4.51 6.16-4.51z"/></svg>
          Continue with Google
        </button>
      </div>
      <p class="inline-note" id="socialNote"></p>

      <p class="switch">Don't have an account? <a href="/signup.html">Sign up</a></p>
    </div>
  </div>

  <div class="modal-overlay" id="forgotModal" style="display:none;">
    <div class="modal-box" role="dialog" aria-modal="true">
      <h2>Reset your password</h2>
      <p class="subtext" style="margin-top:-0.5rem;">Enter your email and we'll send you a reset link.</p>
      <div class="error" id="forgotError"></div>
      <form id="forgotForm">
        <input type="email" id="forgotEmail" placeholder="Email address" required>
        <div class="modal-actions">
          <button type="button" class="btn-outline" id="cancelForgot">Cancel</button>
          <button type="submit">Send reset link</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/categories.js"></script>
  <script>
    let expectedRole = 'client';
    document.querySelectorAll('#accountToggle .role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#accountToggle .role-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        expectedRole = btn.dataset.role;
      });
    });

    document.getElementById('eyeToggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      openModal(document.getElementById('forgotModal'));
    });

    document.getElementById('cancelForgot').addEventListener('click', () => {
      closeModal(document.getElementById('forgotModal'));
    });

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('forgotError');
      errorEl.textContent = '';
      const email = document.getElementById('forgotEmail').value;

      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }
      closeModal(document.getElementById('forgotModal'));
      showToast(data.message, 'success');
    });

    function handleGoogleCredential(response) {
      fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential, expectedRole })
      })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) {
            document.getElementById('error').textContent = data.error;
            return;
          }
          if (data.accountFound === false) {
            sessionStorage.setItem('googlePrefill', JSON.stringify({ email: data.email, name: data.name }));
            document.getElementById('socialNote').textContent = 'No account found for that Google email — taking you to sign up.';
            setTimeout(() => { window.location.href = '/signup.html'; }, 1200);
            return;
          }
          window.location.href = data.role === 'admin' ? '/admin.html' : (data.role === 'provider' ? '/provider-dashboard.html' : '/dashboard.html');
        })
        .catch(() => {
          document.getElementById('error').textContent = 'Something went wrong with Google sign-in. Please try again.';
        });
    }

    fetch('/api/config').then(r => r.json()).then(config => {
      if (!config.googleEnabled) {
        document.getElementById('googleBtn').addEventListener('click', () => {
          document.getElementById('socialNote').textContent = 'Google sign-in isn\u2019t set up yet.';
        });
        return;
      }
      document.getElementById('googleBtn').style.display = 'none';
      const container = document.getElementById('googleBtnReal');
      container.style.display = 'block';
      const waitForGis = setInterval(() => {
        if (window.google && window.google.accounts) {
          clearInterval(waitForGis);
          google.accounts.id.initialize({ client_id: config.googleClientId, callback: handleGoogleCredential });
          const fitWidth = Math.min(Math.round(container.getBoundingClientRect().width) || 300, 400);
          google.accounts.id.renderButton(container, { theme: 'outline', size: 'large', shape: 'pill', width: fitWidth });
        }
      }, 100);
    }).catch(() => {
      document.getElementById('googleBtn').addEventListener('click', () => {
        document.getElementById('socialNote').textContent = 'Google sign-in isn\u2019t set up yet.';
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, remember, expectedRole })
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }
      window.location.href = data.role === 'admin' ? '/admin.html' : (data.role === 'provider' ? '/provider-dashboard.html' : '/dashboard.html');
    });
  </script>

</body>
</html>
