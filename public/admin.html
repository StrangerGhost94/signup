<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body class="app-body">
  <div class="admin-shell">
    <nav class="admin-sidebar">
      <div class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo" style="height:26px;"><span class="admin-badge">ADMIN</span></div>
      <button class="admin-nav-item active" data-section="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Overview
      </button>
      <button class="admin-nav-item" data-section="applications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
        Applications
      </button>
      <button class="admin-nav-item" data-section="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4z"/><path d="M8 2v16M16 6v16"/></svg>
        Live Map
      </button>
      <button class="admin-nav-item" data-section="pricing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Pricing
      </button>
      <button class="admin-nav-item" data-section="safety">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6z"/></svg>
        Safety
      </button>
      <button class="admin-nav-item" data-section="audit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
        Audit Log
      </button>
      <button class="admin-nav-item" data-section="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Users
      </button>
      <div style="flex:1;"></div>
      <button id="logoutBtn" class="admin-nav-item" style="color:var(--danger);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        Log out
      </button>
    </nav>

    <main class="admin-main">
      <div id="overviewSection">
        <h1>Overview</h1>
        <div class="admin-stat-grid" id="overviewStats"></div>
      </div>

      <div id="applicationsSection" style="display:none;">
        <h1>Applications</h1>
        <div class="admin-tabs" id="adminTabs">
          <button class="admin-tab active" data-filter="PENDING">Pending</button>
          <button class="admin-tab" data-filter="">All</button>
          <button class="admin-tab" data-filter="APPROVED">Approved</button>
          <button class="admin-tab" data-filter="REJECTED">Rejected</button>
          <button class="admin-tab" data-filter="SUSPENDED">Suspended</button>
        </div>
        <div class="admin-list" id="adminList"></div>
      </div>

      <div id="mapSection" style="display:none;">
        <h1>Live Map</h1>
        <div class="map-legend">
          <span><span class="dot" style="background:#0B6E4F;"></span>Provider — online</span>
          <span><span class="dot" style="background:#3B6FA0;"></span>Client — online</span>
          <span><span class="dot" style="background:#D97706;"></span>Recently active</span>
          <span><span class="dot" style="background:#9CA3AF;"></span>Offline</span>
        </div>
        <div id="adminMap"></div>
      </div>

      <div id="pricingSection" style="display:none;">
        <h1>Pricing</h1>
        <div class="admin-list" id="pricingList"></div>
      </div>
      <div id="safetySection" style="display:none;">
        <h1>Safety</h1>
        <div class="admin-list" id="safetyList"></div>
      </div>
      <div id="auditSection" style="display:none;">
        <h1>Audit Log</h1>
        <div class="admin-list" id="auditList2"></div>
      </div>
      <div id="usersSection" style="display:none;">
        <h1>Users</h1>
        <div class="admin-list" id="usersList2"></div>
      </div>
    </main>
  </div>

  <script src="js/categories.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    let currentFilter = 'PENDING';

    document.querySelectorAll('#adminTabs .admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#adminTabs .admin-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        loadApplications();
      });
    });

    document.querySelectorAll('[data-section]').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('[data-section]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const section = tab.dataset.section;
        document.getElementById('overviewSection').style.display = section === 'overview' ? 'block' : 'none';
        document.getElementById('applicationsSection').style.display = section === 'applications' ? 'block' : 'none';
        document.getElementById('mapSection').style.display = section === 'map' ? 'block' : 'none';
        document.getElementById('pricingSection').style.display = section === 'pricing' ? 'block' : 'none';
        document.getElementById('safetySection').style.display = section === 'safety' ? 'block' : 'none';
        document.getElementById('auditSection').style.display = section === 'audit' ? 'block' : 'none';
        document.getElementById('usersSection').style.display = section === 'users' ? 'block' : 'none';
        if (section === 'overview') loadOverview();
        if (section === 'map') loadMap();
        if (section === 'pricing') loadPricing();
        if (section === 'safety') loadSafety();
        if (section === 'audit') initAuditLog();
        if (section === 'users') initUsersDirectory();
      });
    });

    async function loadOverview() {
      const grid = document.getElementById('overviewStats');
      grid.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;
      const res = await fetch('/api/admin/overview-stats');
      if (!res.ok) { grid.innerHTML = errorStateHtml('loadOverview()'); return; }
      const d = await res.json();

      const clients = d.usersByRole.client || 0;
      const providers = d.usersByRole.provider || 0;
      const approvedProviders = d.providersByStatus.APPROVED || 0;

      const cards = [
        { label: 'Online right now', value: d.onlineNow, color: '#0B6E4F', bg: '#E6F4EC', icon: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>' },
        { label: 'Active in last 30 min', value: d.recentlyActive, color: '#D97706', bg: '#FEF3C7', icon: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>' },
        { label: 'Clients', value: clients, color: '#3B6FA0', bg: '#DBEAFE', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' },
        { label: 'Providers (approved)', value: `${approvedProviders} / ${providers}`, color: '#8B5E34', bg: '#F1E9E1', icon: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' },
        { label: 'Jobs posted today', value: d.jobsToday, color: '#2F6169', bg: '#E1EEF0', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
        { label: 'Pending applications', value: d.pendingApplications, color: '#B45309', bg: '#FEF3C7', icon: '<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>', alert: d.pendingApplications > 0 },
        { label: 'Open reports', value: d.openReports, color: '#B91C1C', bg: '#FEE2E2', icon: '<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>', alert: d.openReports > 0 },
        { label: 'Open disputes', value: d.openDisputes, color: '#B91C1C', bg: '#FEE2E2', icon: '<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>', alert: d.openDisputes > 0 },
        { label: 'Completed jobs (total value)', value: `UGX ${d.completedJobsValue.toLocaleString()}`, color: '#0B6E4F', bg: '#E6F4EC', icon: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' }
      ];

      grid.innerHTML = cards.map(c => `
        <div class="admin-stat-card${c.alert ? ' alert' : ''}">
          <div class="stat-icon" style="background:${c.bg}; color:${c.color};"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${c.icon}</svg></div>
          <div class="stat-value">${c.value}</div>
          <div class="stat-label">${c.label}</div>
        </div>
      `).join('');
    }

    let adminMapInstance = null;
    async function loadMap() {
      const res = await fetch('/api/admin/user-locations');
      if (!res.ok) return;
      const data = await res.json();

      if (!adminMapInstance) {
        adminMapInstance = L.map('adminMap').setView([0.3476, 32.5825], 11); // Kampala default center
        // CARTO's tiles, not raw openstreetmap.org — OSM's own tile
        // usage policy explicitly asks embedded/production apps to use
        // a dedicated provider rather than their raw tile servers,
        // which are meant for light, occasional use. CARTO's basemap
        // tiles are free, need no API key, and are built for exactly
        // this kind of embedded dashboard use.
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 20
        }).addTo(adminMapInstance);
      }

      // Clear any existing markers before re-plotting.
      adminMapInstance.eachLayer(layer => { if (layer instanceof L.CircleMarker) adminMapInstance.removeLayer(layer); });

      const statusColor = { online: '#0B6E4F', recent: '#D97706', offline: '#9CA3AF' };
      const roleColor = { client: '#3B6FA0', provider: '#0B6E4F' };

      const points = [];
      data.users.forEach(u => {
        const color = u.status === 'offline' ? statusColor.offline : roleColor[u.role];
        const marker = L.circleMarker([u.latitude, u.longitude], {
          radius: 7, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(adminMapInstance);
        marker.bindPopup(`
          <div class="map-popup">
            <strong>${escapeHtml(u.name || u.email)}</strong>
            <span class="role-pill">${u.role}${u.category ? ' · ' + escapeHtml(u.category) : ''}</span><br>
            ${escapeHtml(u.city || u.district || 'Unknown area')} · ${u.status === 'online' ? '🟢 Online now' : u.status === 'recent' ? '🟡 Recently active' : '⚪ Offline'}
          </div>
        `);
        points.push([u.latitude, u.longitude]);
      });

      if (points.length > 0) {
        adminMapInstance.fitBounds(points, { padding: [30, 30], maxZoom: 13 });
      }
      // The container was display:none a moment ago — Leaflet needs an
      // explicit nudge to recompute its size correctly once visible,
      // or it can render at the wrong dimensions.
      setTimeout(() => adminMapInstance.invalidateSize(), 100);
    }

    async function loadApplications() {
      const list = document.getElementById('adminList');
      list.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;
      const params = currentFilter ? `?status=${currentFilter}` : '';
      const res = await fetch('/api/admin/applications' + params);
      if (!res.ok) { list.innerHTML = errorStateHtml('loadApplications()'); return; }
      const data = await res.json();
      list.innerHTML = '';

      if (data.applications.length === 0) {
        list.innerHTML = `<div class="empty-state"><strong>Nothing here</strong>No providers match this filter.</div>`;
        return;
      }

      data.applications.forEach(p => {
        const meta = STATUS_META[p.approval_status.toLowerCase()] || { color: 'var(--ink-soft)', bg: 'var(--surface)', label: p.approval_status };
        const row = document.createElement('div');
        row.className = 'app-row';
        row.innerHTML = `
          <div class="avatar" style="background:var(--surface);">${p.photo ? `<img class="avatar-img" src="${p.photo}" alt="">` : initials(p.name)}</div>
          <div class="app-row-info">
            <strong>${escapeHtml(p.name)}</strong>
            <span>${escapeHtml(p.category)} · ${escapeHtml(p.location)} · ${p.completed_jobs} jobs done${p.report_count > 0 ? ` · ${p.report_count} report(s)` : ''}</span>
          </div>
          <span class="status-badge" style="color:${meta.color}; background:${meta.bg};">${p.approval_status}</span>
        `;
        row.addEventListener('click', () => openDetail(p.id));
        list.appendChild(row);
      });
    }

    async function openDetail(providerId) {
      const res = await fetch(`/api/admin/providers/${providerId}`);
      if (!res.ok) { showToast('Could not load this provider.', 'error'); return; }
      const data = await res.json();
      const p = data.provider;

      const overlay = document.createElement('div');
      overlay.className = 'admin-detail-overlay';
      overlay.innerHTML = `<div class="admin-detail-panel" id="detailPanel"></div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      const panel = overlay.querySelector('#detailPanel');

      const identity = data.verifications.find(v => v.type === 'identity');
      const phone = data.verifications.find(v => v.type === 'phone');
      const idDoc = data.documents.find(d => d.document_type === 'id_document');
      const selfie = data.documents.find(d => d.document_type === 'selfie');

      panel.innerHTML = `
        <button class="chat-back" id="closeDetail" aria-label="Close" style="margin-bottom:1rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>

        <div class="worker-head" style="margin-bottom:1rem;">
          <div class="avatar" style="width:56px;height:56px;">${p.photo ? `<img class="avatar-img" src="${p.photo}" alt="">` : initials(p.name)}</div>
          <div class="worker-name-block">
            <strong style="font-size:1.1rem;">${escapeHtml(p.name)}</strong>
            <span class="job-meta">${escapeHtml(p.email)} · ${escapeHtml(p.user_phone)}</span>
          </div>
        </div>

        <div class="stat-mini-grid detail-section">
          <div class="stat-mini"><strong>${data.jobStats.completed_jobs}</strong><span>Completed</span></div>
          <div class="stat-mini"><strong>${data.jobStats.declined_jobs}</strong><span>Declined</span></div>
          <div class="stat-mini"><strong>${data.disputes.length}</strong><span>Disputes</span></div>
          <div class="stat-mini"><strong>${data.reports.length}</strong><span>Reports</span></div>
        </div>

        <div class="detail-section">
          <h3>Profile</h3>
          <p class="job-desc">${escapeHtml(p.bio || 'No bio provided.')}</p>
          <p class="job-meta">${escapeHtml(p.location)} · ${p.experience_years != null ? p.experience_years + ' yrs experience' : 'Experience not stated'} · Applied ${new Date(p.created_at).toLocaleDateString()}</p>
        </div>

        <div class="detail-section">
          <h3>Identity verification</h3>
          ${statusRow('Identity', identity?.status)}
          ${statusRow('Phone', phone?.status)}
          ${idDoc ? `<p class="job-meta" style="margin-top:0.6rem;">ID document:</p><img class="doc-preview" src="${idDoc.file_data}" alt="ID document">` : '<p class="job-meta">No ID document submitted.</p>'}
          ${selfie ? `<p class="job-meta">Selfie:</p><img class="doc-preview" src="${selfie.file_data}" alt="Selfie">` : ''}
          ${identity ? `
            <div class="action-row">
              <button class="small-btn" onclick="decideVerification(${identity.id}, 'VERIFIED')">Approve identity</button>
              <button class="small-btn btn-decline" onclick="decideVerification(${identity.id}, 'REJECTED')">Reject identity</button>
            </div>` : '<p class="job-meta">Nothing to review yet.</p>'}
        </div>

        <div class="detail-section">
          <h3>Services</h3>
          ${data.services.map(s => `
            <div class="verif-status-row">
              <span>${escapeHtml(s.name)}</span>
              <span>
                ${statusBadgeInline(s.verification_status)}
                <button class="small-btn" style="width:auto; padding:0.3rem 0.6rem; font-size:0.75rem; margin-left:0.4rem;" onclick="decideService(${s.id}, 'VERIFIED')">✓</button>
                <button class="small-btn btn-decline" style="width:auto; padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="decideService(${s.id}, 'REJECTED')">✗</button>
              </span>
            </div>
          `).join('')}
        </div>

        <div class="detail-section">
          <h3>Credentials</h3>
          ${data.credentials.length ? data.credentials.map(c => `<p class="job-meta">${escapeHtml(c.credential_type)} — ${escapeHtml(c.issuing_organization || '')} (${c.status})</p>`).join('') : '<p class="job-meta">None submitted.</p>'}
        </div>

        <div class="detail-section">
          <h3>Application decision</h3>
          <div class="action-row">
            <button class="small-btn" onclick="decideApplication(${p.id}, 'approve')">Approve application</button>
            <button class="small-btn btn-decline" onclick="promptReject(${p.id})">Reject</button>
            <button class="small-btn btn-outline" onclick="promptRequestInfo(${p.id})">Request more info</button>
            ${p.approval_status === 'SUSPENDED'
              ? `<button class="small-btn" onclick="decideApplication(${p.id}, 'reinstate')">Reinstate</button>`
              : `<button class="small-btn btn-decline" onclick="promptSuspend(${p.id})">Suspend</button>`}
            <button class="small-btn btn-decline" onclick="deleteUser(${p.user_id}, '${escapeHtml(p.email)}')">Delete account</button>
          </div>
        </div>

        <div class="detail-section">
          <h3>Recent admin actions</h3>
          ${data.auditHistory.length ? data.auditHistory.map(a => `<p class="job-meta">${new Date(a.created_at).toLocaleString()} — ${escapeHtml(a.action)} by ${escapeHtml(a.actor_email || 'system')}${a.notes ? ': ' + escapeHtml(a.notes) : ''}</p>`).join('') : '<p class="job-meta">No actions yet.</p>'}
        </div>
      `;
      panel.querySelector('#closeDetail').addEventListener('click', () => overlay.remove());
    }

    function statusRow(label, status) {
      return `<div class="verif-status-row"><span>${label}</span>${statusBadgeInline(status || 'PENDING')}</div>`;
    }
    function statusBadgeInline(status) {
      const colors = { VERIFIED: ['#0B6E4F','#E6F4EC'], PENDING: ['#B45309','#FEF3C7'], IN_REVIEW: ['#1D4ED8','#DBEAFE'], REJECTED: ['#B91C1C','#FEE2E2'], SUSPENDED: ['#6B7280','#F3F4F6'], EXPIRED: ['#6B7280','#F3F4F6'] };
      const [color, bg] = colors[status] || colors.PENDING;
      return `<span class="verif-badge" style="color:${color}; background:${bg};">${status}</span>`;
    }

    async function decideVerification(id, decision) {
      let notes = '';
      if (decision === 'REJECTED') {
        notes = prompt('Reason for rejecting this verification:');
        if (!notes) return;
      }
      const res = await fetch(`/api/admin/verifications/${id}/decide`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decision, notes })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Updated.', 'success');
      document.querySelector('.admin-detail-overlay')?.remove();
      loadApplications();
    }

    async function decideService(id, decision) {
      let notes = '';
      if (decision === 'REJECTED') {
        notes = prompt('Reason for rejecting this service:');
        if (!notes) return;
      }
      const res = await fetch(`/api/admin/worker-services/${id}/decide`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decision, notes })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Updated.', 'success');
      document.querySelector('.admin-detail-overlay')?.remove();
      loadApplications();
    }

    async function decideApplication(providerId, action) {
      const res = await fetch(`/api/admin/providers/${providerId}/${action}`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast(data.message, 'success');
      document.querySelector('.admin-detail-overlay')?.remove();
      loadApplications();
    }

    async function promptReject(providerId) {
      const reason = prompt('Reason for rejecting this application:');
      if (!reason) return;
      const res = await fetch(`/api/admin/providers/${providerId}/reject`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Application rejected.', 'success');
      document.querySelector('.admin-detail-overlay')?.remove();
      loadApplications();
    }

    async function promptSuspend(providerId) {
      const reason = prompt('Reason for suspending this provider:');
      if (!reason) return;
      const res = await fetch(`/api/admin/providers/${providerId}/suspend`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Provider suspended.', 'success');
      document.querySelector('.admin-detail-overlay')?.remove();
      loadApplications();
    }

    async function promptRequestInfo(providerId) {
      const message = prompt('What information do you need from this provider?');
      if (!message) return;
      const res = await fetch(`/api/admin/providers/${providerId}/request-info`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Request sent.', 'success');
      document.querySelector('.admin-detail-overlay')?.remove();
    }

    async function loadPricing() {
      const section = document.getElementById('pricingList');
      section.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;

      const [rulesRes, insightsRes] = await Promise.all([
        fetch('/api/admin/pricing-rules'),
        fetch('/api/admin/pricing-insights')
      ]);
      if (!rulesRes.ok || !insightsRes.ok) {
        section.innerHTML = errorStateHtml('loadPricing()');
        return;
      }
      const rulesData = await rulesRes.json();
      const insightsData = await insightsRes.json();
      const insightsByService = {};
      insightsData.insights.forEach(i => { insightsByService[i.service] = i; });

      section.innerHTML = '<h3 style="margin-bottom:0.75rem;">Pricing rules</h3>';
      rulesData.rules.forEach(rule => {
        const hist = insightsByService[rule.service_name];
        const card = document.createElement('div');
        card.className = 'job-card';
        card.innerHTML = `
          <div class="job-top">
            <strong>${escapeHtml(rule.service_name)}</strong>
            <span class="status-badge" style="color:${rule.active ? '#0B6E4F' : '#6B7280'}; background:${rule.active ? '#E6F4EC' : '#F3F4F6'};">${rule.active ? 'Active' : 'Inactive'}</span>
          </div>
          ${hist && hist.sample_size > 0 ? `<p class="job-meta">Historical: ${hist.sample_size} completed job(s), median UGX ${Number(hist.median).toLocaleString()}, typical range UGX ${Number(hist.p25).toLocaleString()}–${Number(hist.p75).toLocaleString()}${hist.sample_size >= 5 ? ' — being used for live estimates' : ' (need 5+ for live use)'}</p>` : `<p class="job-meta">No completed jobs yet — using configured rule below.</p>`}
          <div class="stat-mini-grid" style="grid-template-columns:repeat(2,1fr); margin:0.75rem 0;">
            <div><label class="job-meta">Labour min<input type="number" data-field="labour_min" value="${rule.labour_min}" style="width:100%; padding:0.4rem; border:1px solid var(--line); border-radius:6px; margin-top:0.2rem;"></label></div>
            <div><label class="job-meta">Labour max<input type="number" data-field="labour_max" value="${rule.labour_max}" style="width:100%; padding:0.4rem; border:1px solid var(--line); border-radius:6px; margin-top:0.2rem;"></label></div>
            <div><label class="job-meta">Materials min<input type="number" data-field="materials_min" value="${rule.materials_min}" style="width:100%; padding:0.4rem; border:1px solid var(--line); border-radius:6px; margin-top:0.2rem;"></label></div>
            <div><label class="job-meta">Materials max<input type="number" data-field="materials_max" value="${rule.materials_max}" style="width:100%; padding:0.4rem; border:1px solid var(--line); border-radius:6px; margin-top:0.2rem;"></label></div>
            <div><label class="job-meta">"Now" fee<input type="number" data-field="urgency_now_fee" value="${rule.urgency_now_fee}" style="width:100%; padding:0.4rem; border:1px solid var(--line); border-radius:6px; margin-top:0.2rem;"></label></div>
            <div><label class="job-meta">"Today" fee<input type="number" data-field="urgency_today_fee" value="${rule.urgency_today_fee}" style="width:100%; padding:0.4rem; border:1px solid var(--line); border-radius:6px; margin-top:0.2rem;"></label></div>
          </div>
          <div class="action-row">
            <button class="small-btn" onclick="savePricingRule(${rule.id}, this)">Save changes</button>
            <button class="small-btn ${rule.active ? 'btn-decline' : ''}" onclick="toggleRuleActive(${rule.id}, ${!rule.active})">${rule.active ? 'Deactivate' : 'Activate'}</button>
          </div>
        `;
        section.appendChild(card);
      });

      if (insightsData.divergentJobs.length > 0) {
        const divHeader = document.createElement('h3');
        divHeader.style = 'margin:1.5rem 0 0.75rem;';
        divHeader.textContent = 'Estimates that differed significantly from the final price';
        section.appendChild(divHeader);
        insightsData.divergentJobs.forEach(d => {
          const item = document.createElement('div');
          item.className = 'job-card';
          item.innerHTML = `<p class="job-desc">${escapeHtml(d.service)} — ${escapeHtml(d.job_type)}</p><p class="job-meta">Estimated UGX ${d.total_min.toLocaleString()}–${d.total_max.toLocaleString()}, actual UGX ${d.final_amount.toLocaleString()} (job #${d.job_id})</p>`;
          section.appendChild(item);
        });
      }
    }

    async function savePricingRule(id, btnEl) {
      const card = btnEl.closest('.job-card');
      const payload = {};
      card.querySelectorAll('input[data-field]').forEach(input => {
        payload[input.dataset.field] = parseInt(input.value, 10);
      });
      const res = await fetch(`/api/admin/pricing-rules/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Pricing rule updated.', 'success');
    }

    async function toggleRuleActive(id, active) {
      const res = await fetch(`/api/admin/pricing-rules/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ active })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast(active ? 'Rule activated.' : 'Rule deactivated.', 'success');
      loadPricing();
    }

    async function loadSafety() {
      const section = document.getElementById('safetyList');
      section.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;

      const [reportsRes, disputesRes, msgRes] = await Promise.all([
        fetch('/api/admin/reports?status=OPEN'),
        fetch('/api/admin/disputes?status=OPEN'),
        fetch('/api/admin/flagged-messages')
      ]);
      if (!reportsRes.ok || !disputesRes.ok || !msgRes.ok) {
        section.innerHTML = errorStateHtml('loadSafety()');
        return;
      }
      const reportsData = await reportsRes.json();
      const disputesData = await disputesRes.json();
      const msgData = await msgRes.json();

      section.innerHTML = '';

      const reportsHeader = document.createElement('h3');
      reportsHeader.textContent = `Open reports (${reportsData.reports.length})`;
      section.appendChild(reportsHeader);
      if (reportsData.reports.length === 0) {
        section.innerHTML += `<p class="job-meta" style="margin-bottom:1.5rem;">Nothing open.</p>`;
      }
      reportsData.reports.forEach(r => {
        const card = document.createElement('div');
        card.className = 'job-card';
        card.innerHTML = `
          <div class="job-top">
            <div>
              <strong>${escapeHtml(r.category.replace(/_/g, ' '))}</strong>
              <p class="job-meta">${escapeHtml(r.reporter_email)} reported ${escapeHtml(r.reported_email)} · ${new Date(r.created_at).toLocaleDateString()}</p>
            </div>
          </div>
          <p class="job-desc">${escapeHtml(r.description)}</p>
          ${r.attachment ? `<img class="doc-preview" src="${r.attachment}" alt="Attachment">` : ''}
          <div class="action-row">
            <button class="small-btn" onclick="resolveReport(${r.id}, 'RESOLVED')">Mark resolved</button>
            <button class="small-btn btn-outline" onclick="resolveReport(${r.id}, 'DISMISSED')">Dismiss</button>
            <button class="small-btn btn-decline" onclick="suspendReportedUser(${r.reported_user_id})">Suspend reported user</button>
            <button class="small-btn btn-decline" onclick="deleteUser(${r.reported_user_id}, '${escapeHtml(r.reported_email)}')">Delete reported user</button>
          </div>
        `;
        section.appendChild(card);
      });

      const disputesHeader = document.createElement('h3');
      disputesHeader.style = 'margin-top:1.5rem;';
      disputesHeader.textContent = `Open disputes (${disputesData.disputes.length})`;
      section.appendChild(disputesHeader);
      if (disputesData.disputes.length === 0) {
        section.innerHTML += `<p class="job-meta" style="margin-bottom:1.5rem;">Nothing open.</p>`;
      }
      disputesData.disputes.forEach(d => {
        const card = document.createElement('div');
        card.className = 'job-card';
        card.innerHTML = `
          <div class="job-top">
            <strong>Job #${d.job_id} — ${escapeHtml(d.category)}</strong>
          </div>
          <p class="job-meta">Raised by ${escapeHtml(d.raised_by_email)} · ${new Date(d.created_at).toLocaleDateString()}</p>
          <p class="job-desc">${escapeHtml(d.reason)}</p>
          <div class="action-row">
            <button class="small-btn" onclick="resolveDispute(${d.id}, 'RESOLVED')">Mark resolved</button>
            <button class="small-btn btn-outline" onclick="resolveDispute(${d.id}, 'DISMISSED')">Dismiss</button>
          </div>
        `;
        section.appendChild(card);
      });

      const msgHeader = document.createElement('h3');
      msgHeader.style = 'margin-top:1.5rem;';
      msgHeader.textContent = `Flagged messages (${msgData.messages.length})`;
      section.appendChild(msgHeader);
      if (msgData.messages.length === 0) {
        section.innerHTML += `<p class="job-meta">Nothing flagged.</p>`;
      }
      msgData.messages.forEach(m => {
        const card = document.createElement('div');
        card.className = 'job-card';
        card.innerHTML = `
          <p class="job-meta">${escapeHtml(m.sender_email)} · ${new Date(m.created_at).toLocaleDateString()} · ${escapeHtml(m.flag_reason)}</p>
          <p class="job-desc">"${escapeHtml(m.body)}"</p>
        `;
        section.appendChild(card);
      });
    }

    async function resolveReport(id, status) {
      const notes = status === 'RESOLVED' ? (prompt('Any notes on how this was resolved?') || '') : '';
      const res = await fetch(`/api/admin/reports/${id}/resolve`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status, adminNotes: notes })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Report updated.', 'success');
      loadSafety();
    }

    async function resolveDispute(id, status) {
      const notes = status === 'RESOLVED' ? (prompt('Resolution notes:') || '') : '';
      const res = await fetch(`/api/admin/disputes/${id}/resolve`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status, resolutionNotes: notes })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Dispute updated.', 'success');
      loadSafety();
    }

    async function deleteUser(userId, email) {
      const typed = prompt(`This permanently deletes ${email} and everything tied to their account — bookings, messages, reviews, listings. This cannot be undone.\n\nType the email address to confirm:`);
      if (typed !== email) {
        if (typed !== null) showToast('Email didn\u2019t match — nothing was deleted.', 'error');
        return;
      }
      const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('Account deleted.', 'success');
      document.querySelector('.admin-detail-overlay')?.remove();
      loadApplications();
      loadSafety();
      if (usersBuilt) loadUsers(false);
    }

    async function suspendReportedUser(userId) {
      const reason = prompt('Reason for suspending this account:');
      if (!reason) return;
      const res = await fetch(`/api/admin/users/${userId}/suspend`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('User suspended.', 'success');
      loadSafety();
    }

    let auditBuilt = false;
    let lastAuditId = null;

    let usersBuilt = false;
    let lastUserId = null;

    async function initUsersDirectory() {
      const section = document.getElementById('usersList2');
      if (!usersBuilt) {
        usersBuilt = true;
        section.innerHTML = `
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
            <input type="text" id="userSearch" placeholder="Search name, email, or phone..." style="flex:1; min-width:200px; margin-bottom:0;">
            <select id="userRoleFilter" style="width:auto; padding:0.85rem 1rem; border:1.5px solid var(--line); border-radius:var(--radius-sm); font-family:inherit; background:var(--surface);">
              <option value="">All roles</option>
              <option value="client">Clients</option>
              <option value="provider">Providers</option>
              <option value="admin">Admins</option>
            </select>
            <select id="userStatusFilter" style="width:auto; padding:0.85rem 1rem; border:1.5px solid var(--line); border-radius:var(--radius-sm); font-family:inherit; background:var(--surface);">
              <option value="">Any status</option>
              <option value="NORMAL">Normal</option>
              <option value="SUSPENDED">Suspended</option>
              <option value="BANNED">Banned</option>
            </select>
          </div>
          <div id="usersList"></div>
          <button type="button" id="usersLoadMore" class="btn-outline" style="display:none; margin-top:0.75rem;">Load more</button>
        `;

        let searchDebounce;
        document.getElementById('userSearch').addEventListener('input', () => {
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(() => loadUsers(false), 300);
        });
        document.getElementById('userRoleFilter').addEventListener('change', () => loadUsers(false));
        document.getElementById('userStatusFilter').addEventListener('change', () => loadUsers(false));
        document.getElementById('usersLoadMore').addEventListener('click', () => loadUsers(true));
      }
      loadUsers(false);
    }

    async function loadUsers(append) {
      const list = document.getElementById('usersList');
      if (!append) {
        list.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;
        lastUserId = null;
      }

      const params = new URLSearchParams();
      const search = document.getElementById('userSearch').value.trim();
      const role = document.getElementById('userRoleFilter').value;
      const status = document.getElementById('userStatusFilter').value;
      if (search) params.set('search', search);
      if (role) params.set('role', role);
      if (status) params.set('status', status);
      if (append && lastUserId) params.set('beforeId', lastUserId);

      const res = await fetch('/api/admin/users?' + params.toString());
      if (!res.ok) { list.innerHTML = errorStateHtml(''); return; }
      const data = await res.json();

      if (!append) list.innerHTML = '';
      if (!append && data.users.length === 0) {
        list.innerHTML = `<div class="empty-state"><strong>No matching users</strong>Try a different search or filter.</div>`;
      }
      data.users.forEach(u => {
        const row = document.createElement('div');
        row.className = 'user-row';
        const statusColors = { NORMAL: ['#0B6E4F', '#E6F4EC'], SUSPENDED: ['#B45309', '#FEF3C7'], BANNED: ['#B91C1C', '#FEE2E2'] };
        const [sColor, sBg] = statusColors[u.account_status] || statusColors.NORMAL;
        row.innerHTML = `
          <div class="avatar">${initials(u.name || u.email)}</div>
          <div class="user-row-info">
            <strong>${escapeHtml(u.name || u.email)}</strong>
            <span>${escapeHtml(u.email)}${u.phone ? ' · ' + escapeHtml(u.phone) : ''}</span>
            <div class="user-row-badges">
              <span class="user-role-pill">${escapeHtml(u.role)}</span>
              <span class="verif-badge" style="color:${sColor}; background:${sBg};">${escapeHtml(u.account_status)}</span>
              ${u.provider_id ? `<span class="verif-badge" style="color:#1D4ED8; background:#DBEAFE;">${escapeHtml(u.approval_status)}</span>` : ''}
              ${u.provider_id ? `<span class="user-role-pill">★ ${u.rating || '—'}</span>` : ''}
            </div>
          </div>
          <div class="user-row-actions">
            ${u.account_status === 'SUSPENDED'
              ? `<button class="small-btn" onclick="reinstateUser(${u.id})">Reinstate</button>`
              : `<button class="small-btn btn-outline" onclick="promptSuspendUser(${u.id})">Suspend</button>`}
            <button class="small-btn btn-decline" onclick="deleteUser(${u.id}, '${escapeHtml(u.email)}')">Delete</button>
          </div>
        `;
        list.appendChild(row);
        lastUserId = u.id;
      });

      document.getElementById('usersLoadMore').style.display = data.hasMore ? 'block' : 'none';
    }

    async function promptSuspendUser(userId) {
      const reason = prompt('Reason for suspending this account:');
      if (!reason) return;
      const res = await fetch(`/api/admin/users/${userId}/suspend`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason })
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('User suspended.', 'success');
      loadUsers(false);
    }

    async function reinstateUser(userId) {
      const res = await fetch(`/api/admin/users/${userId}/reinstate`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }
      showToast('User reinstated.', 'success');
      loadUsers(false);
    }

    async function initAuditLog() {
      const section = document.getElementById('auditList2');
      if (!auditBuilt) {
        auditBuilt = true;
        const actionsRes = await fetch('/api/admin/audit-log-actions');
        const actionsData = actionsRes.ok ? await actionsRes.json() : { actions: [] };

        section.innerHTML = `
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
            <input type="text" id="auditSearch" placeholder="Search action, notes, or admin email..." style="flex:1; min-width:200px; margin-bottom:0;">
            <select id="auditActionFilter" style="width:auto; padding:0.85rem 1rem; border:1.5px solid var(--line); border-radius:var(--radius-sm); font-family:inherit; background:var(--surface);">
              <option value="">All actions</option>
              ${actionsData.actions.map(a => `<option value="${a}">${a}</option>`).join('')}
            </select>
            <input type="date" id="auditFrom" style="width:auto; margin-bottom:0;">
            <input type="date" id="auditTo" style="width:auto; margin-bottom:0;">
          </div>
          <div id="auditList"></div>
          <button type="button" id="auditLoadMore" class="btn-outline" style="display:none; margin-top:0.75rem;">Load more</button>
        `;

        let searchDebounce;
        document.getElementById('auditSearch').addEventListener('input', () => {
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(() => loadAuditLogs(false), 300);
        });
        document.getElementById('auditActionFilter').addEventListener('change', () => loadAuditLogs(false));
        document.getElementById('auditFrom').addEventListener('change', () => loadAuditLogs(false));
        document.getElementById('auditTo').addEventListener('change', () => loadAuditLogs(false));
        document.getElementById('auditLoadMore').addEventListener('click', () => loadAuditLogs(true));
      }
      loadAuditLogs(false);
    }

    async function loadAuditLogs(append) {
      const list = document.getElementById('auditList');
      if (!append) {
        list.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;
        lastAuditId = null;
      }

      const params = new URLSearchParams();
      const search = document.getElementById('auditSearch').value.trim();
      const action = document.getElementById('auditActionFilter').value;
      const from = document.getElementById('auditFrom').value;
      const to = document.getElementById('auditTo').value;
      if (search) params.set('search', search);
      if (action) params.set('action', action);
      if (from) params.set('from', from);
      if (to) params.set('to', to);
      if (append && lastAuditId) params.set('beforeId', lastAuditId);

      const res = await fetch('/api/admin/audit-logs?' + params.toString());
      if (!res.ok) { list.innerHTML = errorStateHtml(''); return; }
      const data = await res.json();

      if (!append) list.innerHTML = '';
      if (!append && data.logs.length === 0) {
        list.innerHTML = `<div class="empty-state"><strong>No matching entries</strong>Try a different search or filter.</div>`;
      }
      data.logs.forEach(l => {
        const row = document.createElement('div');
        row.className = 'job-card';
        row.style.marginBottom = '0.6rem';
        row.innerHTML = `
          <div class="job-top">
            <strong style="font-size:0.88rem;">${escapeHtml(l.action)}</strong>
            <span class="job-meta">${new Date(l.created_at).toLocaleString()}</span>
          </div>
          <p class="job-meta">By ${escapeHtml(l.actor_email || 'system')}${l.target_type ? ` · ${escapeHtml(l.target_type)} #${l.target_id}` : ''}</p>
          ${l.notes ? `<p class="job-desc">${escapeHtml(l.notes)}</p>` : ''}
        `;
        list.appendChild(row);
        lastAuditId = l.id;
      });

      document.getElementById('auditLoadMore').style.display = data.hasMore ? 'block' : 'none';
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      if (me.role !== 'admin') { window.location.href = '/dashboard.html'; return; }
      await loadOverview();
    })();
  </script>
</body>
</html>
