<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body has-bottom-nav">
  <div class="app-shell">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="app-main">
      <div class="dash-wrap" style="padding-top:calc(1.5rem + env(safe-area-inset-top));">
        <h1 style="font-size:1.4rem; font-weight:800; margin:0 0 1.25rem;">Messages</h1>
        <div id="conversationsList" class="stagger"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script src="js/categories.js"></script>
  <script>
    const CLIENT_SIDEBAR_LINKS = [
      { href: '/dashboard.html', label: 'Home', icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>' },
      { href: '/client-jobs.html', label: 'Jobs', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
      { href: '/messages.html', label: 'Messages', icon: '<path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/>', active: true },
      { href: '/profile.html', label: 'Profile', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
    ];
    const CLIENT_BOTTOM_LINKS = [
      { href: '/dashboard.html', label: 'Home', icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>' },
      { href: '/client-jobs.html', label: 'Jobs', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
      { href: '/dashboard.html', label: 'Post a Job', icon: '<path d="M12 5v14M5 12h14"/>', isPost: true },
      { href: '/messages.html', label: 'Messages', icon: '<path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/>', active: true },
      { href: '/profile.html', label: 'Profile', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
    ];

    const PROVIDER_SIDEBAR_LINKS = [
      { href: '/provider-dashboard.html', label: 'Jobs', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
      { href: '/provider-my-jobs.html', label: 'My Jobs', icon: '<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>' },
      { href: '/provider-earnings.html', label: 'Earnings', icon: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
      { href: '/messages.html', label: 'Messages', icon: '<path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/>', active: true },
      { href: '/provider-profile.html', label: 'Profile', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
    ];
    const PROVIDER_BOTTOM_LINKS = [
      { href: '/provider-dashboard.html', label: 'Jobs', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
      { href: '/provider-my-jobs.html', label: 'My Jobs', icon: '<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>' },
      { href: '/provider-earnings.html', label: 'Earnings', icon: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
      { href: '/messages.html', label: 'Messages', icon: '<path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/>', active: true },
      { href: '/provider-profile.html', label: 'Profile', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
    ];

    function buildNav(isProvider) {
      const sidebar = document.getElementById('sidebarNav');
      const bottom = document.getElementById('bottomNav');
      const homeHref = isProvider ? '/provider-dashboard.html' : '/dashboard.html';
      const sidebarLinks = isProvider ? PROVIDER_SIDEBAR_LINKS : CLIENT_SIDEBAR_LINKS;
      const bottomLinks = isProvider ? PROVIDER_BOTTOM_LINKS : CLIENT_BOTTOM_LINKS;

      sidebar.innerHTML = `<a href="${homeHref}" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo">${isProvider ? '<span class="pro-badge">PRO</span>' : ''}</a>` +
        sidebarLinks.map(l => `<a href="${l.href}" class="${l.active ? 'active' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${l.icon}</svg>${l.label}</a>`).join('') +
        (isProvider ? '' : `<button type="button" class="sidebar-post" onclick="window.location.href='/dashboard.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Post a job</button>`);

      bottom.innerHTML = bottomLinks.map(l => `
        <a href="${l.href}" class="nav-item ${l.active ? 'active' : ''} ${l.isPost ? 'nav-post' : ''}" ${l.isPost ? `aria-label="${l.label}"` : ''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${l.isPost ? '2.5' : '2'}">${l.icon}</svg>${l.isPost ? '' : l.label}
        </a>
      `).join('');
    }

    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      buildNav(me.role === 'provider');
      await loadConversations();
      setInterval(loadConversations, 10000);
      refreshOnResume(loadConversations);
    })();

    async function loadConversations() {
      const list = document.getElementById('conversationsList');
      list.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;

      const res = await fetch('/api/conversations');
      if (!res.ok) {
        list.innerHTML = errorStateHtml('loadConversations()');
        return;
      }
      const data = await res.json();
      list.innerHTML = '';

      if (data.conversations.length === 0) {
        list.innerHTML = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>
          <strong>No conversations yet</strong>
          Once you have a booking, you can message about it here.
        </div>`;
        return;
      }

      data.conversations.forEach(c => {
        const color = categoryColor(c.category);
        const item = document.createElement('div');
        item.className = 'recent-job-item';
        item.style.setProperty('--cat-color', color);
        item.style.cursor = 'pointer';
        const hasUnread = c.unread_count > 0;
        const preview = c.last_message ? escapeHtml(c.last_message.slice(0, 50)) : 'No messages yet — say hello.';
        const avatarHtml = c.other_party_photo
          ? `<img class="avatar-img" src="${c.other_party_photo}" alt="">`
          : initials(c.other_party_name);
        item.innerHTML = `
          <div class="avatar" style="background:color-mix(in srgb, ${color} 15%, white); color:${color};">${avatarHtml}</div>
          <div class="recent-job-info">
            <strong style="${hasUnread ? 'font-weight:800;' : ''}">${escapeHtml(c.other_party_name || 'Unknown')} · ${escapeHtml(c.category)}</strong>
            <span style="${hasUnread ? 'color:var(--ink); font-weight:600;' : ''}">${preview}</span>
          </div>
          <div class="recent-job-right">
            ${c.last_message_at ? `<span class="job-meta" style="display:block; margin-bottom:0.3rem;">${relativeTime(c.last_message_at)}</span>` : ''}
            ${hasUnread ? `<span class="status-badge" style="color:#fff; background:var(--primary);">${c.unread_count}</span>` : ''}
          </div>
        `;
        item.addEventListener('click', () => {
          window.location.href = `/message-thread.html?jobId=${c.job_id}`;
        });
        list.appendChild(item);
      });
    }
  </script>
</body>
</html>
