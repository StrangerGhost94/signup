<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body has-bottom-nav">
  <div class="app-shell">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="app-main">
      <div class="dash-wrap" style="padding-top:calc(1.5rem + env(safe-area-inset-top));">
        <header class="dash-header">
          <h1 style="font-size:1.4rem; font-weight:800; margin:0;">Messages</h1>
          <div class="dash-user" style="position:relative;">
            <button class="bell-btn" id="bellBtn" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              <span class="bell-dot" id="bellDot" style="display:none;"></span>
            </button>
          </div>
        </header>
        <div id="conversationsList" class="stagger"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script src="js/categories.js"></script>
  <script>
    const CLIENT_SIDEBAR_LINKS = [
      { href: '/dashboard.html', label: 'Home', icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>' },
      { href: '/client-jobs.html', label: 'Jobs', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
      { href: '/messages.html', label: 'Messages', icon: '<path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/>', active: true },
      { href: '/profile.html', label: 'Profile', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
    ];
    const CLIENT_BOTTOM_LINKS = [
      { href: '/dashboard.html', label: 'Home', icon: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>' },
      { href: '/client-jobs.html', label: 'Jobs', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
      { href: '/messages.html', label: 'Messages', icon: '<path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/>', active: true },
      { href: '/profile.html', label: 'Profile', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
    ];

    const PROVIDER_SIDEBAR_LINKS = [
      { href: '/provider-dashboard.html', label: 'Jobs', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
      { href: '/provider-earnings.html', label: 'Earnings', icon: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
      { href: '/messages.html', label: 'Messages', icon: '<path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/>', active: true },
      { href: '/provider-profile.html', label: 'Profile', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
    ];
    const PROVIDER_BOTTOM_LINKS = [
      { href: '/provider-dashboard.html', label: 'Jobs', icon: '<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/>' },
      { href: '/provider-earnings.html', label: 'Earnings', icon: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
      { href: '/messages.html', label: 'Messages', icon: '<path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/>', active: true },
      { href: '/provider-profile.html', label: 'Profile', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>' }
    ];

    function buildNav(isProvider) {
      const sidebar = document.getElementById('sidebarNav');
      const bottom = document.getElementById('bottomNav');
      const homeHref = isProvider ? '/provider-dashboard.html' : '/dashboard.html';
      const sidebarLinks = isProvider ? PROVIDER_SIDEBAR_LINKS : CLIENT_SIDEBAR_LINKS;
      const bottomLinks = isProvider ? PROVIDER_BOTTOM_LINKS : CLIENT_BOTTOM_LINKS;

      sidebar.innerHTML = `<a href="${homeHref}" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo">${isProvider ? '<span class="pro-badge">PRO</span>' : ''}</a>` +
        sidebarLinks.map(l => `<a href="${l.href}" class="${l.active ? 'active' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${l.icon}</svg>${l.label}</a>`).join('') +
        (isProvider ? '' : `<button type="button" class="sidebar-post" onclick="window.location.href='/dashboard.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Post a job</button>`);

      bottom.innerHTML = bottomLinks.map(l => `
        <a href="${l.href}" class="nav-item ${l.active ? 'active' : ''} ${l.isPost ? 'nav-post' : ''}" ${l.isPost ? `aria-label="${l.label}"` : ''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${l.isPost ? '2.5' : '2'}">${l.icon}</svg>${l.isPost ? '' : l.label}
        </a>
      `).join('');
    }

    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      buildNav(me.role === 'provider');
      await loadConversations();
      const refreshNotifications = initNotificationBell();
      setInterval(loadConversations, 10000);
      setInterval(() => refreshNotifications(), 20000);
      refreshOnResume(() => { loadConversations(); refreshNotifications(); });
    })();

    async function loadConversations() {
      const list = document.getElementById('conversationsList');
      list.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;

      const res = await fetch('/api/conversations');
      if (!res.ok) {
        list.innerHTML = errorStateHtml('loadConversations()');
        return;
      }
      const data = await res.json();
      list.innerHTML = '';

      if (data.conversations.length === 0) {
        list.innerHTML = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>
          <strong>No conversations yet</strong>
          Once you have a booking, you can message about it here.
        </div>`;
        return;
      }

      // Grouped by person (WhatsApp-style contact list). A person with
      // a single job opens that thread directly; a person with several
      // jobs expands to show each job's own thread, so messages stay
      // tied to the specific job they belong to.
      data.conversations.forEach(person => {
        const hasUnread = person.totalUnread > 0;
        const multi = person.threads.length > 1;
        const firstColor = categoryColor(person.threads[0].category);

        const item = document.createElement('div');
        item.className = 'recent-job-item';
        item.style.setProperty('--cat-color', firstColor);
        item.style.cursor = 'pointer';

        const avatarHtml = person.otherPartyPhoto
          ? `<img class="avatar-img" src="${person.otherPartyPhoto}" alt="">`
          : initials(person.otherPartyName || '?');

        const latest = person.threads[0];
        const preview = latest.lastHasAttachment
          ? '\uD83D\uDCF7 Photo'
          : (person.lastMessage ? escapeHtml(person.lastMessage.slice(0, 50)) : 'No messages yet \u2014 say hello.');

        const subtitle = multi
          ? `${person.threads.length} jobs \u00B7 tap to view`
          : escapeHtml(latest.category);

        item.innerHTML = `
          <div class="avatar" style="background:color-mix(in srgb, ${firstColor} 15%, white); color:${firstColor};">${avatarHtml}</div>
          <div class="recent-job-info">
            <strong style="${hasUnread ? 'font-weight:800;' : ''}">${escapeHtml(person.otherPartyName || 'Unknown')}</strong>
            <span class="job-meta" style="display:block;">${subtitle}</span>
            <span style="${hasUnread ? 'color:var(--ink); font-weight:600;' : ''}">${preview}</span>
          </div>
          <div class="recent-job-right">
            ${person.lastMessageAt ? `<span class="job-meta" style="display:block; margin-bottom:0.3rem;">${relativeTime(person.lastMessageAt)}</span>` : ''}
            ${hasUnread ? `<span class="status-badge" style="color:#fff; background:var(--primary);">${person.totalUnread}</span>` : ''}
          </div>
        `;

        if (!multi) {
          item.addEventListener('click', () => {
            window.location.href = `/message-thread.html?jobId=${latest.jobId}`;
          });
          list.appendChild(item);
          return;
        }

        // Multiple jobs with this person: expand in place rather than
        // navigating, so choosing the right thread is one tap away.
        const threadsWrap = document.createElement('div');
        threadsWrap.style.cssText = 'display:none; margin:-0.4rem 0 0.65rem 0; padding-left:1rem;';
        person.threads.forEach(t => {
          const meta = STATUS_META[t.status] || { label: t.status, color: 'var(--ink-soft)', bg: 'var(--surface)' };
          const tColor = categoryColor(t.category);
          const row = document.createElement('div');
          row.className = 'recent-job-item';
          row.style.setProperty('--cat-color', tColor);
          row.style.cursor = 'pointer';
          row.innerHTML = `
            <div class="recent-job-icon"><svg viewBox="0 0 24 24" fill="none" stroke="${tColor}" stroke-width="2">${categoryIcon(t.category)}</svg></div>
            <div class="recent-job-info">
              <strong style="${t.unreadCount > 0 ? 'font-weight:800;' : ''}">${escapeHtml(t.category)}</strong>
              <span>${t.lastHasAttachment ? '\uD83D\uDCF7 Photo' : (t.lastMessage ? escapeHtml(t.lastMessage.slice(0, 40)) : 'No messages yet')}</span>
            </div>
            <div class="recent-job-right">
              <span class="status-badge" style="color:${meta.color}; background:${meta.bg};">${meta.label}</span>
              ${t.unreadCount > 0 ? `<span class="status-badge" style="color:#fff; background:var(--primary); margin-top:0.3rem;">${t.unreadCount}</span>` : ''}
            </div>
          `;
          row.addEventListener('click', (e) => {
            e.stopPropagation();
            window.location.href = `/message-thread.html?jobId=${t.jobId}`;
          });
          threadsWrap.appendChild(row);
        });

        item.addEventListener('click', () => {
          const open = threadsWrap.style.display === 'block';
          threadsWrap.style.display = open ? 'none' : 'block';
        });

        list.appendChild(item);
        list.appendChild(threadsWrap);
      });
    }
  </script>
</body>
</html>
