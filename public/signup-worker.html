<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create worker account — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
  <div class="card card-wide">
    <div class="card-body">
      <a href="/signup.html" class="back-arrow" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>

      <h1 style="margin-top:0;">Create worker account</h1>
      <p class="subtext">Tell us about your skills and experience.</p>

      <div class="error" id="error"></div>

      <div id="googleBtnReal" style="display:none; margin-bottom:1rem;"></div>

      <form id="signupForm">
        <div class="photo-upload-row">
          <div class="photo-preview" id="photoPreview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
          <label class="photo-upload-label" for="photoInput">Add profile photo (optional)</label>
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
        </div>

        <div class="input-icon-wrap">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input type="text" id="name" placeholder="Full name — e.g. John Kamau" required>
        </div>

        <div class="input-icon-wrap">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.11 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.98.36 1.94.68 2.86a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.22-1.25a2 2 0 0 1 2.11-.45c.92.32 1.88.55 2.86.68A2 2 0 0 1 22 16.92z"/></svg>
          <input type="tel" id="phone" placeholder="Phone number — e.g. 0772 123 456" required>
        </div>

        <div class="input-icon-wrap">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
          <input type="email" id="email" placeholder="Email address — e.g. john@example.com" required>
        </div>

        <div class="input-icon-wrap">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="10" width="15" height="10.5" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="14.8" r="1.3" fill="currentColor" stroke="none"/><path d="M12 16.1v1.6" stroke-width="2"/></svg>
          <input type="password" id="password" placeholder="Create password — 8+ chars, a letter and a number" required>
          <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="pw-checklist" id="pwChecklist">
          <span id="pwLength"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>8+ characters</span>
          <span id="pwLetter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>A letter</span>
          <span id="pwNumber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>A number</span>
        </div>

        <label style="display:block; font-weight:700; font-size:0.88rem; margin-bottom:0.5rem;">What service do you offer?</label>
        <select id="category" required style="width:100%; padding:0.85rem 1rem; margin-bottom:1rem; border:1.5px solid var(--line); border-radius:var(--radius-sm); font-size:1rem; font-family:inherit; background:var(--surface); color:var(--ink);">
          <option value="" disabled selected>Select your primary service</option>
          <option>Plumbing</option>
          <option>Electrical</option>
          <option>Carpentry</option>
          <option>Painting</option>
          <option>Cleaning</option>
          <option>Gardening</option>
          <option>Moving</option>
          <option>Mechanical</option>
        </select>

        <input type="text" id="location" placeholder="Area you serve — e.g. Ntinda, Kampala" required>
        <textarea id="bio" rows="3" placeholder="Short bio — experience, specialties (optional)"></textarea>

        <button type="submit">Create account</button>
        <p class="inline-note">By creating an account, you agree to our <a href="/terms.html" style="color:var(--primary); font-weight:600;">Terms of Service</a> and <a href="/privacy.html" style="color:var(--primary); font-weight:600;">Privacy Policy</a>.</p>
      </form>
    </div>
  </div>

  <script src="js/categories.js"></script>
  <script>
    function decodeJwtPayload(token) {
      try {
        const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')));
      } catch (err) {
        return null;
      }
    }

    function applyPrefill(name, email) {
      if (name) document.getElementById('name').value = name;
      if (email) document.getElementById('email').value = email;
      showToast('Details filled in from Google — just set a password to finish.');
    }

    function handleGoogleCredential(response) {
      const payload = decodeJwtPayload(response.credential);
      if (payload) applyPrefill(payload.name, payload.email);
    }

    fetch('/api/config').then(r => r.json()).then(config => {
      if (!config.googleEnabled) return;
      const container = document.getElementById('googleBtnReal');
      container.style.display = 'block';
      const waitForGis = setInterval(() => {
        if (window.google && window.google.accounts) {
          clearInterval(waitForGis);
          google.accounts.id.initialize({ client_id: config.googleClientId, callback: handleGoogleCredential });
          const fitWidth = Math.min(Math.round(container.getBoundingClientRect().width) || 300, 400);
          google.accounts.id.renderButton(container, { theme: 'outline', size: 'large', shape: 'pill', width: fitWidth, text: 'continue_with' });
        }
      }, 100);
    }).catch(() => {});

    let compressedPhoto = null;

    document.getElementById('photoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        compressedPhoto = await compressImageFile(file, 320, 0.75);
        document.getElementById('photoPreview').innerHTML = `<img src="${compressedPhoto}" alt="">`;
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    document.getElementById('eyeToggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('password').addEventListener('input', (e) => {
      const strength = checkPasswordStrength(e.target.value);
      ['length', 'letter', 'number'].forEach(key => {
        document.getElementById('pw' + key.charAt(0).toUpperCase() + key.slice(1)).classList.toggle('met', strength[key]);
      });
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const payload = {
        role: 'provider',
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        category: document.getElementById('category').value,
        location: document.getElementById('location').value,
        bio: document.getElementById('bio').value,
        photo: compressedPhoto
      };

      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }
      window.location.href = '/provider-dashboard.html';
    });
  </script>
</body>
</html>
