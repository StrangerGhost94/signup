<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job requests — HandyLink Pro</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body has-bottom-nav">
  <div class="app-shell" id="appShell" style="visibility:hidden;">
    <nav class="sidebar-nav">
      <a href="/provider-dashboard.html" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo"><span class="pro-badge">PRO</span></a>
      <a href="/provider-dashboard.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/></svg>Jobs</a>
      <a href="/provider-my-jobs.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>My Jobs</a>
      <a href="/provider-earnings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Earnings</a>
      <a href="/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>Messages</a>
      <a href="/provider-profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
    </nav>

    <div class="app-main">
      <div class="dash-wrap">
        <header class="dash-header">
          <h1 style="font-size:1.4rem; font-weight:800; margin:0;">Job requests</h1>
          <div class="dash-user" style="position:relative;">
            <span id="welcome"></span>
            <button class="bell-btn" id="bellBtn" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              <span class="bell-dot" id="bellDot" style="display:none;"></span>
            </button>
            <div id="notifPanel" class="search-suggestions" style="display:none; right:0; left:auto; width:300px; max-width:80vw;"></div>
          </div>
        </header>

        <div id="approvalBanner" style="display:none; border-radius:var(--radius); padding:0.9rem 1.1rem; margin-bottom:1.25rem; font-size:0.88rem;"></div>
        <div id="locationBanner" style="display:none; border-radius:var(--radius); padding:0.9rem 1.1rem; margin-bottom:1.25rem; font-size:0.88rem; background:var(--primary-tint); align-items:center; justify-content:space-between; gap:0.75rem; flex-wrap:wrap;">
          <span>📍 Turn on location so nearby jobs can find you automatically — no need to set it manually again.</span>
          <button type="button" id="enableLocationBtn" class="small-btn" style="width:auto; flex-shrink:0;">Enable</button>
        </div>

        <div class="filters" id="jobTabBar" style="margin-bottom:1rem;">
          <button class="filter-btn active" data-tab="requests">Job Requests</button>
          <button class="filter-btn" data-tab="open">Open Jobs<span id="openJobsCount" style="display:none;"></span></button>
        </div>

        <div id="jobsList" class="stagger"></div>
        <div id="openJobsList" class="stagger" style="display:none;"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/provider-dashboard.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/></svg>Jobs</a>
    <a href="/provider-my-jobs.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>My Jobs</a>
    <a href="/provider-earnings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Earnings</a>
    <a href="/messages.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>Messages</a>
    <a href="/provider-profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <div class="modal-overlay" id="offerModal" style="display:none;">
    <div class="modal-box" role="dialog" aria-modal="true">
      <h2>Submit your offer</h2>
      <p class="job-meta" id="offerEstimateNote" style="margin-top:-0.5rem; margin-bottom:1rem;"></p>
      <div class="error" id="offerError"></div>
      <label>Labour (UGX)</label>
      <input type="number" id="offerLabour" min="0">
      <label>Materials (UGX)</label>
      <input type="number" id="offerMaterials" min="0" value="0">
      <div class="est-cost-box" style="margin-bottom:1rem;">
        <span class="est-label">Your total</span>
        <div class="est-total" id="offerTotalDisplay">UGX 0</div>
      </div>
      <label>Message to the customer (optional)</label>
      <textarea id="offerMessage" rows="3" placeholder="e.g. I can start tomorrow morning and bring all materials."></textarea>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="cancelOffer">Cancel</button>
        <button type="button" id="submitOffer">Submit offer</button>
      </div>
    </div>
  </div>

  <script src="js/categories.js"></script>
  <script>
    document.querySelectorAll('#jobTabBar .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#jobTabBar .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('jobsList').style.display = tab === 'requests' ? 'block' : 'none';
        document.getElementById('openJobsList').style.display = tab === 'open' ? 'block' : 'none';
        if (tab === 'open') loadOpenJobs();
      });
    });

    async function loadOpenJobs() {
      const list = document.getElementById('openJobsList');
      list.innerHTML = `<div class="skeleton skeleton-row"></div>`;
      const res = await fetch('/api/jobs/open');
      if (!res.ok) { list.innerHTML = errorStateHtml('loadOpenJobs()'); return; }
      const data = await res.json();

      const countEl = document.getElementById('openJobsCount');
      if (data.jobs.length > 0) {
        countEl.textContent = ` (${data.jobs.length})`;
        countEl.style.display = 'inline';
      } else {
        countEl.style.display = 'none';
      }

      if (data.jobs.length === 0) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l2-3h14l2 3M3 7v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M3 7h18M9 11h6"/></svg><strong>No open jobs right now</strong>Jobs posted for multiple quotes in your category will show up here.</div>`;
        return;
      }

      list.innerHTML = '';
      data.jobs.forEach(j => {
        const card = document.createElement('div');
        card.className = 'job-card fade-in-up';
        const hasOffer = !!j.my_offer_id;
        card.innerHTML = `
          <div class="job-top">
            <div>
              <strong>${escapeHtml(j.category)} — ${escapeHtml(j.client_email)}</strong>
              <p class="job-meta">${escapeHtml(j.location)} · Estimate UGX ${j.estimate_amount.toLocaleString()} · ${new Date(j.created_at).toLocaleDateString()}</p>
            </div>
          </div>
          <p class="job-desc">${escapeHtml(j.description)}</p>
          ${hasOffer ? `<p class="job-meta" style="color:var(--primary-deep); font-weight:600;">✓ You submitted an offer${j.my_offer_status === 'DECLINED' ? ' — the customer chose another pro' : ''}</p>` : ''}
          <div class="job-actions" data-actions></div>
        `;
        const actions = card.querySelector('[data-actions]');
        const btn = document.createElement('button');
        btn.className = hasOffer ? 'small-btn btn-outline' : 'small-btn';
        btn.textContent = hasOffer ? 'Update offer' : 'Submit offer';
        btn.onclick = () => openOfferModal(j.id, j.estimate_amount);
        actions.appendChild(btn);
        list.appendChild(card);
      });
    }

    let currentOfferJobId = null;

    function openOfferModal(jobId, estimateAmount) {
      currentOfferJobId = jobId;
      document.getElementById('offerEstimateNote').textContent = `Estimated around UGX ${estimateAmount.toLocaleString()} total.`;
      document.getElementById('offerLabour').value = '';
      document.getElementById('offerMaterials').value = '0';
      document.getElementById('offerMessage').value = '';
      document.getElementById('offerError').textContent = '';
      updateOfferTotal();
      openModal(document.getElementById('offerModal'));
    }

    function updateOfferTotal() {
      const labour = parseInt(document.getElementById('offerLabour').value, 10) || 0;
      const materials = parseInt(document.getElementById('offerMaterials').value, 10) || 0;
      document.getElementById('offerTotalDisplay').textContent = `UGX ${(labour + materials).toLocaleString()}`;
    }
    document.getElementById('offerLabour').addEventListener('input', updateOfferTotal);
    document.getElementById('offerMaterials').addEventListener('input', updateOfferTotal);

    document.getElementById('cancelOffer').addEventListener('click', () => closeModal(document.getElementById('offerModal')));

    document.getElementById('submitOffer').addEventListener('click', async () => {
      const errorEl = document.getElementById('offerError');
      const labour = parseInt(document.getElementById('offerLabour').value, 10);
      if (!Number.isInteger(labour) || labour < 0) {
        errorEl.textContent = 'Please enter a valid labour amount.';
        return;
      }
      const materials = parseInt(document.getElementById('offerMaterials').value, 10) || 0;
      const message = document.getElementById('offerMessage').value;

      const res = await fetch(`/api/jobs/${currentOfferJobId}/offers`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ labourAmount: labour, materialsAmount: materials, message })
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error; return; }
      closeModal(document.getElementById('offerModal'));
      showToast('Offer submitted.', 'success');
      loadOpenJobs();
    });

    async function loadJobs() {
      const res = await fetch('/api/provider/jobs');
      if (!res.ok) return;
      const data = await res.json();
      const requested = data.jobs.filter(j => j.status === 'requested');
      const list = document.getElementById('jobsList');
      list.innerHTML = '';

      if (requested.length === 0) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l2-3h14l2 3M3 7v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M3 7h18M9 11h6"/></svg><strong>No new job requests</strong>When a client books you, it'll show up here.</div>`;
        return;
      }

      requested.forEach(j => {
        const urgencyMeta = URGENCY_OPTIONS.find(u => u.value === j.urgency);
        const card = document.createElement('div');
        card.className = 'job-card fade-in-up';
        card.innerHTML = `
          <div class="job-top">
            <div>
              <strong>${escapeHtml(j.category)} — ${escapeHtml(j.client_email)}</strong>
              <p class="job-meta">${new Date(j.created_at).toLocaleDateString()} · ${escapeHtml(j.location)} · <span style="color:${(URGENCY_OPTIONS.find(u=>u.value===j.urgency)||{}).color}">${urgencyMeta ? urgencyMeta.label : escapeHtml(j.urgency)}</span></p>
            </div>
            <span class="status-badge" style="color:${STATUS_META.requested.color}; background:${STATUS_META.requested.bg};">New</span>
          </div>
          <p class="job-desc">${escapeHtml(j.description)}${j.location_notes ? `<br><span class="job-meta">${escapeHtml(j.location_notes)}</span>` : ''}</p>
          ${j.ai_complexity ? `<p class="job-meta">AI assessment: ${escapeHtml(j.ai_complexity)} complexity${(() => { try { const m = JSON.parse(j.ai_materials || '[]'); return m.length ? ' · ' + m.map(escapeHtml).join(', ') : ''; } catch (e) { return ''; } })()}${j.ai_total_min != null ? ` · Estimated UGX ${j.ai_total_min.toLocaleString()}–${j.ai_total_max.toLocaleString()}` : ''}</p>` : ''}
          <div class="job-actions" data-actions></div>
        `;
        const actions = card.querySelector('[data-actions]');

        if (j.ai_total_min != null) {
          const acceptEstBtn = document.createElement('button');
          acceptEstBtn.className = 'small-btn';
          const midpoint = Math.round((j.ai_total_min + j.ai_total_max) / 2);
          acceptEstBtn.textContent = `Accept UGX ${midpoint.toLocaleString()}`;
          acceptEstBtn.onclick = () => actOnJob(j.id, 'accept');
          actions.appendChild(acceptEstBtn);

          const quoteBtn = document.createElement('button');
          quoteBtn.className = 'small-btn btn-outline';
          quoteBtn.textContent = 'Submit different quote';
          quoteBtn.onclick = () => submitQuote(j.id, midpoint);
          actions.appendChild(quoteBtn);
        } else {
          const acceptBtn = document.createElement('button');
          acceptBtn.className = 'small-btn';
          acceptBtn.textContent = 'Accept';
          acceptBtn.onclick = () => actOnJob(j.id, 'accept');
          actions.appendChild(acceptBtn);
        }

        const declineBtn = document.createElement('button');
        declineBtn.className = 'small-btn btn-decline';
        declineBtn.textContent = 'Decline';
        declineBtn.onclick = () => {
          if (confirm('Decline this job request? The client will be notified.')) {
            actOnJob(j.id, 'decline');
          }
        };
        actions.appendChild(declineBtn);
        const messageBtn = document.createElement('button');
        messageBtn.className = 'small-btn btn-outline';
        messageBtn.textContent = 'Message';
        messageBtn.onclick = () => window.location.href = `/message-thread.html?jobId=${j.id}`;
        actions.appendChild(messageBtn);
        list.appendChild(card);
      });
    }

    function submitQuote(jobId, suggestedTotal) {
      const labour = prompt(`AI estimated around UGX ${suggestedTotal.toLocaleString()} total.\n\nYour labour amount (UGX):`);
      if (labour === null) return;
      const materials = prompt('Your materials amount (UGX):');
      if (materials === null) return;
      const reason = prompt('Why this amount? (shown to the client)');
      if (!reason) return;

      fetch(`/api/provider/jobs/${jobId}/accept-with-quote`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ labourAmount: parseInt(labour, 10), materialsAmount: parseInt(materials, 10), reason })
      })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) { showToast(data.error, 'error'); return; }
          showToast('Job accepted — your quote is awaiting client approval.', 'success');
          loadJobs();
        });
    }

    async function actOnJob(id, action) {
      const res = await fetch(`/api/provider/jobs/${id}/${action}`, { method: 'PUT' });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error, 'error');
        return;
      }
      showToast(action === 'accept' ? 'Job accepted.' : 'Job declined.', action === 'accept' ? 'success' : null);
      loadJobs();
    }

    const refreshNotifications = initNotificationBell();

    async function loadApprovalBanner() {
      const res = await fetch('/api/provider/verification-status');
      if (!res.ok) return;
      const data = await res.json();
      const banner = document.getElementById('approvalBanner');
      if (data.approvalStatus === 'APPROVED') {
        banner.style.display = 'none';
        return;
      }
      const msgs = {
        PENDING: { bg: 'var(--primary-tint)', color: 'var(--primary-deep)', text: '⏳ Your application is under review — you\u2019ll start receiving jobs once approved.' },
        REJECTED: { bg: '#FEE2E2', color: '#B91C1C', text: '✗ Your application was not approved. Visit your profile or contact Support for details.' },
        SUSPENDED: { bg: '#F3F4F6', color: '#6B7280', text: '⚠ Your account is currently suspended and can\u2019t accept new jobs.' }
      };
      const m = msgs[data.approvalStatus] || msgs.PENDING;
      banner.style.display = 'block';
      banner.style.background = m.bg;
      banner.style.color = m.color;
      banner.textContent = m.text;
    }

    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      if (me.role !== 'provider') { window.location.href = '/dashboard.html'; return; }
      document.getElementById('welcome').textContent = me.email;
      document.getElementById('appShell').style.visibility = 'visible';
      await loadJobs();
      await loadOpenJobs();
      await loadApprovalBanner();
      
      const locationState = await startAutoLocationIfPermitted();
      const locationBanner = document.getElementById('locationBanner');
      if (locationState === 'prompt') {
        locationBanner.style.display = 'flex';
        document.getElementById('enableLocationBtn').addEventListener('click', async (e) => {
          const ok = await enableAutoLocationTracking(e.target);
          if (ok) { locationBanner.style.display = 'none'; showToast('Location enabled — you\u2019re all set.', 'success'); }
          else { showToast('Couldn\u2019t get your location. Please allow the permission prompt.', 'error'); }
        });
      } else if (locationState === 'denied') {
        locationBanner.style.display = 'flex';
        locationBanner.querySelector('span').textContent = '📍 Location is blocked in your browser settings — enable it there to be matched with nearby jobs automatically.';
        document.getElementById('enableLocationBtn').style.display = 'none';
      }

      if (new URLSearchParams(window.location.search).get('tab') === 'open') {
        document.querySelector('[data-tab="open"]').click();
      }
      setInterval(() => refreshNotifications(), 20000);
      setInterval(() => loadJobs(), 10000);
      setInterval(() => loadOpenJobs(), 15000);
      refreshOnResume(() => { loadJobs(); loadOpenJobs(); refreshNotifications(); });
    })();
  </script>
</body>
</html>
