    <div class="app-main">

    <a href="/provider-profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <script src="js/categories.js"></script>
  <script>
    async function loadJobs() {
      const res = await fetch('/api/provider/jobs');
      if (!res.ok) return;
      const data = await res.json();
      const requested = data.jobs.filter(j => j.status === 'requested');
      const list = document.getElementById('jobsList');
      list.innerHTML = '';

      if (requested.length === 0) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l2-3h14l2 3M3 7v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M3 7h18M9 11h6"/></svg><strong>No new job requests</strong>When a client books you, it'll show up here.</div>`;
        return;
      }

      requested.forEach(j => {
        const urgencyMeta = URGENCY_OPTIONS.find(u => u.value === j.urgency);
        const card = document.createElement('div');
        card.className = 'job-card fade-in-up';
        card.innerHTML = `
          <div class="job-top">
            <div>
              <strong>${escapeHtml(j.category)} — ${escapeHtml(j.client_email)}</strong>
              <p class="job-meta">${new Date(j.created_at).toLocaleDateString()} · ${escapeHtml(j.location)} · <span style="color:${(URGENCY_OPTIONS.find(u=>u.value===j.urgency)||{}).color}">${urgencyMeta ? urgencyMeta.label : escapeHtml(j.urgency)}</span></p>
            </div>
            <span class="status-badge" style="color:${STATUS_META.requested.color}; background:${STATUS_META.requested.bg};">New</span>
          </div>
          <p class="job-desc">${escapeHtml(j.description)}${j.location_notes ? `<br><span class="job-meta">${escapeHtml(j.location_notes)}</span>` : ''}</p>
          <div class="job-actions" data-actions></div>
        `;
        const actions = card.querySelector('[data-actions]');
        const acceptBtn = document.createElement('button');
        acceptBtn.className = 'small-btn';
        acceptBtn.textContent = 'Accept';
        acceptBtn.onclick = () => actOnJob(j.id, 'accept');
        const declineBtn = document.createElement('button');
        declineBtn.className = 'small-btn btn-decline';
        declineBtn.textContent = 'Decline';
        declineBtn.onclick = () => {
          if (confirm('Decline this job request? The client will be notified.')) {
            actOnJob(j.id, 'decline');
          }
        };
        const messageBtn = document.createElement('button');
        messageBtn.className = 'small-btn btn-outline';
        messageBtn.textContent = 'Message';
        messageBtn.onclick = () => window.location.href = `/message-thread.html?jobId=${j.id}`;
        actions.appendChild(acceptBtn);
        actions.appendChild(declineBtn);
        actions.appendChild(messageBtn);
        list.appendChild(card);
      });
    }

    async function actOnJob(id, action) {
      const res = await fetch(`/api/provider/jobs/${id}/${action}`, { method: 'PUT' });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error, 'error');
        return;
      }
      showToast(action === 'accept' ? 'Job accepted.' : 'Job declined.', action === 'accept' ? 'success' : null);
      loadJobs();
    }

    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      if (me.role !== 'provider') { window.location.href = '/dashboard.html'; return; }
      document.getElementById('welcome').textContent = me.email;
      document.getElementById('appShell').style.visibility = 'visible';
      await loadJobs();
    })();
  </script>
</body>
</html>
