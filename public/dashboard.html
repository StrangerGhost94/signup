<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find a handyman — Handy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dash-wrap">
    <header class="dash-header">
      <div>
        <span class="wordmark">HANDY</span>
        <h1>Find a handyman</h1>
      </div>
      <div class="dash-user">
        <span id="welcome"></span>
        <button id="logoutBtn" class="small-btn logout-btn">Log out</button>
      </div>
    </header>

    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search by name, skill, or location...">
    </div>

    <div class="filters" id="filters"></div>

    <div class="worker-grid" id="workerGrid"></div>
    <p id="noResults" style="display:none;">No handymen found. Try a different search.</p>
  </div>

  <script>
    const CATEGORY_COLORS = {
      'Plumbing': '#2F6169',
      'Electrical': '#B9791C',
      'Carpentry': '#8B5E34',
      'Painting': '#A24E67',
      'Cleaning': '#3F7D63',
      'Gardening': '#5C8A3A',
      'Moving': '#5A5F73'
    };

    let activeCategory = '';

    async function checkAuth() {
      const res = await fetch('/api/me');
      if (!res.ok) {
        window.location.href = '/login.html';
        return null;
      }
      const me = await res.json();
      if (me.role === 'provider') {
        window.location.href = '/provider-dashboard.html';
        return null;
      }
      return me;
    }

    async function loadCategories() {
      const res = await fetch('/api/categories');
      const data = await res.json();
      const filtersEl = document.getElementById('filters');

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.innerHTML = '<span class="dot"></span>All';
      allBtn.onclick = () => selectCategory('', allBtn);
      filtersEl.appendChild(allBtn);

      data.categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        const color = CATEGORY_COLORS[cat] || '#2F6169';
        btn.innerHTML = `<span class="dot" style="background:${color}"></span>${cat}`;
        btn.onclick = () => selectCategory(cat, btn);
        filtersEl.appendChild(btn);
      });
    }

    function selectCategory(cat, btnEl) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active');
        const dot = b.querySelector('.dot');
        if (dot && b !== btnEl) {
          const originalColor = dot.style.background;
          // restore non-active dot color (already set inline, just remove active override)
        }
      });
      btnEl.classList.add('active');
      loadWorkers();
    }

    async function loadWorkers() {
      const search = document.getElementById('searchInput').value;
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (activeCategory) params.set('category', activeCategory);

      const res = await fetch('/api/workers?' + params.toString());
      const data = await res.json();
      renderWorkers(data.workers);
    }

    function renderWorkers(workers) {
      const grid = document.getElementById('workerGrid');
      const noResults = document.getElementById('noResults');
      grid.innerHTML = '';

      if (workers.length === 0) {
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';

      workers.forEach(w => {
        const color = CATEGORY_COLORS[w.category] || '#2F6169';
        const card = document.createElement('div');
        card.className = 'worker-card';
        card.style.setProperty('--cat-color', color);
        card.innerHTML = `
          <div class="worker-top">
            <strong>${w.name}</strong>
            <span class="rating">★ ${w.rating}</span>
          </div>
          <span class="tag">${w.category}</span>
          <p class="location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            ${w.location}
          </p>
          <p class="bio">${w.bio}</p>
          <a href="tel:${w.phone}"><button class="small-btn contact-btn">Contact ${w.phone}</button></a>
        `;
        grid.appendChild(card);
      });
    }

    let debounceTimer;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadWorkers, 250);
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    (async () => {
      const me = await checkAuth();
      if (!me) return;
      document.getElementById('welcome').textContent = `Signed in as ${me.email}`;
      await loadCategories();
      await loadWorkers();
    })();
  </script>
</body>
</html>
