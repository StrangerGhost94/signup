<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body has-bottom-nav">
  <div class="app-shell" id="appShell" style="visibility:hidden;">
    <nav class="sidebar-nav">
      <a href="/dashboard.html" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo"></a>
      <a href="/dashboard.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
      <a href="#recentJobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/></svg>Jobs</a>
      <a href="/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>Messages</a>
      <a href="/profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
      <button type="button" class="sidebar-post" onclick="openPostModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Post a job</button>
    </nav>

    <div class="app-main">
  <div class="dash-wrap">
    <header class="app-topbar">
      <div>
        <a href="/dashboard.html" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo"></a>
        <button class="location-pill" id="locationBtn" style="background:none; border:none; cursor:pointer; width:auto; min-height:auto; padding:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          Kampala
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px;"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="topbar-right" style="position:relative;">
        <button class="bell-btn" id="bellBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="bell-dot" id="bellDot" style="display:none;"></span>
        </button>
        <div id="notifPanel" class="search-suggestions" style="display:none; right:0; left:auto; width:300px; max-width:80vw;"></div>
      </div>
    </header>

    <div class="search-bar" style="position:relative;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="What do you need help with?" autocomplete="off">
      <div id="searchSuggestions" class="search-suggestions" style="display:none;"></div>
    </div>

    <div id="homeContent">
      <div class="home-cat-grid" id="homeCatGrid" style="margin-top:1.25rem;"></div>

      <div class="promo-card">
        <div class="promo-text">
          <strong>Need someone urgently?</strong>
          <span>Get a verified professional near you.</span>
        </div>
        <button type="button" id="getHelpNowBtn">Get Help Now</button>
      </div>

      <h2 class="section-title" id="recentJobs">Recent jobs</h2>
      <div id="bookingsList" class="stagger"></div>
    </div>

    <div id="searchResults" style="display:none;">
      <div class="filters" id="filters"></div>
      <p class="status-line" id="statusLine"></p>
      <div class="worker-grid stagger" id="workerGrid"></div>
    </div>
  </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/dashboard.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="#recentJobs" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/></svg>Jobs</a>
    <a href="#homeCatGrid" class="nav-item nav-post"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="/messages.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>Messages</a>
    <a href="/profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <div class="modal-overlay" id="rateModal" style="display:none;">
    <div class="modal-box" role="dialog" aria-modal="true">
      <h2>How was it?</h2>
      <div class="star-picker" id="starPicker">
        <button type="button" data-v="1">★</button>
        <button type="button" data-v="2">★</button>
        <button type="button" data-v="3">★</button>
        <button type="button" data-v="4">★</button>
        <button type="button" data-v="5">★</button>
      </div>
      <textarea id="reviewComment" rows="3" placeholder="Tell us about your experience (optional)"></textarea>
      <div class="error" id="rateError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="cancelRate">Cancel</button>
        <button type="button" id="submitRate">Submit review</button>
      </div>
    </div>
  </div>

  <script src="js/categories.js"></script>
  <script>
    let activeCategory = '';
    let ratingJobId = null;
    let selectedStars = 0;

    async function checkAuth() {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return null; }
      const me = await res.json();
      if (me.role === 'provider') { window.location.href = '/provider-dashboard.html'; return null; }
      return me;
    }

    function buildCategoryGrid() {
      const grid = document.getElementById('homeCatGrid');
      Object.keys(CATEGORY_COLORS).forEach(cat => {
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'home-cat-tile';
        tile.innerHTML = `<div class="icon-chip" style="background:color-mix(in srgb, ${categoryColor(cat)} 16%, white);"><svg viewBox="0 0 24 24" fill="none" stroke="${categoryColor(cat)}" stroke-width="1.8">${categoryIcon(cat)}</svg></div><span>${cat}</span>`;
        tile.onclick = () => window.location.href = `/request.html?category=${encodeURIComponent(cat)}`;
        grid.appendChild(tile);
      });
    }

    document.getElementById('locationBtn').addEventListener('click', () => {
      showToast('Location selection isn\u2019t built yet — showing all of Kampala.');
    });

    async function loadNotifications(render) {
      const res = await fetch('/api/notifications');
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById('bellDot').style.display = data.unreadCount > 0 ? 'block' : 'none';
      if (render) {
        const panel = document.getElementById('notifPanel');
        if (data.notifications.length === 0) {
          panel.innerHTML = `<div style="padding:1rem; text-align:center; color:var(--ink-soft); font-size:0.85rem;">No notifications yet.</div>`;
        } else {
          panel.innerHTML = data.notifications.map(n => `
            <div class="suggestion-row" style="align-items:flex-start;" data-link="${n.link || ''}">
              <div class="icon-chip" style="background:${n.read_at ? 'var(--surface)' : 'var(--primary-tint)'};">
                <svg viewBox="0 0 24 24" fill="none" stroke="${n.read_at ? 'var(--ink-soft)' : 'var(--primary)'}" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
              </div>
              <div>
                <span style="display:block; font-weight:${n.read_at ? '500' : '700'};">${escapeHtml(n.body)}</span>
                <span style="font-size:0.72rem; color:var(--ink-soft); font-weight:400;">${relativeTime(n.created_at)}</span>
              </div>
            </div>
          `).join('');
          panel.querySelectorAll('.suggestion-row').forEach(row => {
            row.addEventListener('click', () => {
              if (row.dataset.link) window.location.href = row.dataset.link;
            });
          });
        }
      }
    }

    document.getElementById('bellBtn').addEventListener('click', async (e) => {
      e.stopPropagation();
      const panel = document.getElementById('notifPanel');
      const showing = panel.style.display === 'block';
      panel.style.display = showing ? 'none' : 'block';
      if (!showing) {
        await loadNotifications(true);
        await fetch('/api/notifications/read', { method: 'POST' });
        document.getElementById('bellDot').style.display = 'none';
      }
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.topbar-right')) document.getElementById('notifPanel').style.display = 'none';
    });

    document.getElementById('getHelpNowBtn').addEventListener('click', () => {
      sessionStorage.setItem('preferredUrgency', 'now');
      document.getElementById('homeCatGrid').scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('homeCatGrid').style.outline = '2px solid var(--primary)';
      document.getElementById('homeCatGrid').style.outlineOffset = '6px';
      setTimeout(() => { document.getElementById('homeCatGrid').style.outline = 'none'; }, 1500);
    });

    let bookingsShowAll = false;

    async function loadBookings() {
      const list = document.getElementById('bookingsList');
      list.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;

      let res;
      try {
        res = await fetch('/api/bookings/mine');
      } catch (err) {
        list.innerHTML = errorStateHtml('loadBookings()');
        return;
      }
      if (!res.ok) {
        list.innerHTML = errorStateHtml('loadBookings()');
        return;
      }
      const data = await res.json();
      list.innerHTML = '';

      if (data.bookings.length === 0) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l2-3h14l2 3M3 7v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M3 7h18M9 11h6"/></svg><strong>No jobs yet</strong>Pick a category above to get started.</div>`;
        return;
      }

      const shown = bookingsShowAll ? data.bookings : data.bookings.slice(0, 8);
      shown.forEach(b => {
        const meta = STATUS_META[b.status] || STATUS_META.requested;
        const color = categoryColor(b.category);
        const item = document.createElement('div');
        item.className = 'recent-job-item';
        item.style.setProperty('--cat-color', color);
        item.innerHTML = `
          <div class="recent-job-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${categoryIcon(b.category)}</svg></div>
          <div class="recent-job-info">
            <strong>${escapeHtml(b.category)} — ${escapeHtml(b.description.slice(0, 40))}${b.description.length > 40 ? '…' : ''}</strong>
            <span>${escapeHtml(b.provider_name)} · ${new Date(b.created_at).toLocaleDateString()}</span>
          </div>
          <div class="recent-job-right">
            <span class="status-badge" style="color:${meta.color}; background:${meta.bg};">${meta.label}</span>
            <button class="small-btn" style="width:auto; padding:0.35rem; margin-top:0.4rem; background:var(--surface); color:var(--ink);" onclick="event.stopPropagation(); window.location.href='/message-thread.html?jobId=${b.id}';" aria-label="Message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>
            </button>
          </div>
        `;
        item.style.cursor = 'pointer';
        item.addEventListener('click', () => showBookingDetail(b));
        list.appendChild(item);
      });

      if (!bookingsShowAll && data.bookings.length > 8) {
        const moreBtn = document.createElement('button');
        moreBtn.className = 'btn-outline';
        moreBtn.style.marginTop = '0.25rem';
        moreBtn.textContent = `Show all ${data.bookings.length} bookings`;
        moreBtn.onclick = () => { bookingsShowAll = true; loadBookings(); };
        list.appendChild(moreBtn);
      }
    }

    function showBookingDetail(b) {
      if (b.status === 'accepted') {
        window.location.href = `tel:${b.provider_phone}`;
      } else if (b.status === 'completed' && !b.reviewed) {
        openRateModal(b.id);
      }
    }

    window.openRateModal = function (jobId) {
      ratingJobId = jobId;
      selectedStars = 0;
      document.querySelectorAll('#starPicker button').forEach(b => b.classList.remove('selected'));
      document.getElementById('reviewComment').value = '';
      document.getElementById('rateError').textContent = '';
      openModal(document.getElementById('rateModal'));
    };

    document.querySelectorAll('#starPicker button').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedStars = parseInt(btn.dataset.v, 10);
        document.querySelectorAll('#starPicker button').forEach(b => {
          b.classList.toggle('selected', parseInt(b.dataset.v, 10) <= selectedStars);
        });
      });
    });

    document.getElementById('cancelRate').addEventListener('click', () => {
      closeModal(document.getElementById('rateModal'));
    });

    document.getElementById('submitRate').addEventListener('click', async () => {
      const errorEl = document.getElementById('rateError');
      if (selectedStars < 1) {
        errorEl.textContent = 'Please choose a star rating.';
        return;
      }
      const res = await fetch('/api/reviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobId: ratingJobId, rating: selectedStars, comment: document.getElementById('reviewComment').value })
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error; return; }
      closeModal(document.getElementById('rateModal'));
      loadBookings();
    });

    function setMode(searching) {
      document.getElementById('homeContent').style.display = searching ? 'none' : 'block';
      document.getElementById('searchResults').style.display = searching ? 'block' : 'none';
    }

    async function loadCategories() {
      const res = await fetch('/api/categories');
      const data = await res.json();
      const filtersEl = document.getElementById('filters');
      filtersEl.innerHTML = '';
      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = 'All';
      allBtn.onclick = () => selectCategory('', allBtn);
      filtersEl.appendChild(allBtn);
      data.categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="${categoryColor(cat)}" stroke-width="2">${categoryIcon(cat)}</svg>${cat}`;
        btn.onclick = () => selectCategory(cat, btn);
        filtersEl.appendChild(btn);
      });
    }

    function selectCategory(cat, btnEl) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      loadWorkers();
    }

    let myLat = null;
    let myLng = null;
    let locationRequested = false;

    function captureMyLocation() {
      return new Promise((resolve) => {
        window.promptForLocation((lat, lng) => {
          myLat = lat;
          myLng = lng;
          resolve();
        });
      });
    }

    async function loadWorkers() {
      const search = document.getElementById('searchInput').value;
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (activeCategory) params.set('category', activeCategory);
      document.getElementById('statusLine').textContent = '';
      document.getElementById('workerGrid').innerHTML = `<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>`;

      if (!locationRequested) {
        locationRequested = true;
        captureMyLocation().then(() => {
          if (myLat !== null) loadWorkers(); // re-sort with distance once available
        });
      }

      let res;
      try {
        res = await fetch('/api/workers?' + params.toString());
      } catch (err) {
        document.getElementById('workerGrid').innerHTML = errorStateHtml('loadWorkers()');
        return;
      }
      if (!res.ok) {
        document.getElementById('workerGrid').innerHTML = errorStateHtml('loadWorkers()');
        return;
      }
      const data = await res.json();
      let workers = data.workers;
      if (myLat !== null) {
        workers = workers.map(w => ({ ...w, _distance: distanceKm(myLat, myLng, w.latitude, w.longitude) }));
        workers.sort((a, b) => {
          if (a._distance === null && b._distance === null) return 0;
          if (a._distance === null) return 1;
          if (b._distance === null) return -1;
          return a._distance - b._distance;
        });
      }
      renderWorkers(workers);
    }

    function renderWorkers(workers) {
      const grid = document.getElementById('workerGrid');
      const statusLine = document.getElementById('statusLine');
      grid.innerHTML = '';
      if (workers.length === 0) {
        statusLine.textContent = '';
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l2-3h14l2 3M3 7v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M3 7h18M9 11h6"/></svg><strong>No pros match that search</strong>Try a different trade or clear your filters.</div>`;
        return;
      }
      statusLine.textContent = `${workers.length} pro${workers.length === 1 ? '' : 's'} available${myLat !== null ? ' · nearest first' : ''}`;
      workers.forEach(w => {
        const color = categoryColor(w.category);
        const card = document.createElement('div');
        card.className = 'worker-card';
        card.style.setProperty('--cat-color', color);
        const distanceLabel = (w._distance !== null && w._distance !== undefined) ? `${w._distance.toFixed(1)} km away` : null;
        card.innerHTML = `
          <div class="worker-head">
            <div class="avatar">${w.photo ? `<img class="avatar-img" src="${w.photo}" alt="">` : initials(w.name)}</div>
            <div class="worker-name-block">
              <strong>${escapeHtml(w.name)}</strong>
              <span class="worker-cat"><svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2">${categoryIcon(w.category)}</svg>${escapeHtml(w.category)}</span>
            </div>
            <span class="rating"><span class="star">★</span> ${w.rating}</span>
          </div>
          <p class="location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            ${escapeHtml(w.location)}${distanceLabel ? ` · ${distanceLabel}` : ''}
          </p>
          <p class="bio">${escapeHtml(w.bio)}</p>
          <a href="tel:${w.phone}"><button class="small-btn contact-btn">Contact ${w.phone}</button></a>
        `;
        grid.appendChild(card);
      });
    }

    let debounceTimer;
    let categoriesLoaded = false;
    const searchInput = document.getElementById('searchInput');
    const suggestionsBox = document.getElementById('searchSuggestions');

    function renderSuggestions(query) {
      const q = query.trim().toLowerCase();
      const matches = Object.keys(CATEGORY_COLORS).filter(cat => cat.toLowerCase().includes(q));
      if (matches.length === 0) {
        suggestionsBox.style.display = 'none';
        return;
      }
      suggestionsBox.innerHTML = matches.map(cat => `
        <div class="suggestion-row" data-cat="${cat}">
          <div class="icon-chip" style="background:color-mix(in srgb, ${categoryColor(cat)} 16%, white);">
            <svg viewBox="0 0 24 24" fill="none" stroke="${categoryColor(cat)}" stroke-width="1.8">${categoryIcon(cat)}</svg>
          </div>
          <span>${cat}</span>
        </div>
      `).join('');
      suggestionsBox.querySelectorAll('.suggestion-row').forEach(row => {
        row.addEventListener('click', () => {
          searchInput.value = row.dataset.cat;
          suggestionsBox.style.display = 'none';
          setMode(true);
          if (!categoriesLoaded) { categoriesLoaded = true; loadCategories(); }
          activeCategory = row.dataset.cat;
          loadWorkers();
        });
      });
      suggestionsBox.style.display = 'block';
    }

    searchInput.addEventListener('focus', () => renderSuggestions(searchInput.value));
    searchInput.addEventListener('input', () => {
      const val = searchInput.value;
      renderSuggestions(val);
      setMode(val.length > 0);
      if (val.length > 0) {
        if (!categoriesLoaded) { categoriesLoaded = true; loadCategories(); }
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(loadWorkers, 250);
      }
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-bar')) suggestionsBox.style.display = 'none';
    });

    (async () => {
      const me = await checkAuth();
      if (!me) return;
      document.getElementById('appShell').style.visibility = 'visible';
      buildCategoryGrid();
      await loadBookings();
      await loadNotifications(false);
      setInterval(() => loadNotifications(false), 20000);
      setInterval(() => loadBookings(), 15000);
    })();
  </script>
</body>
</html>
