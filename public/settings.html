<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="dash-wrap" style="max-width:480px;">
    <a href="/profile.html" class="chat-back" style="margin-bottom:1rem;" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <h1 style="font-size:1.3rem; font-weight:800; margin-bottom:1.25rem;">Settings</h1>

    <p class="settings-section-label">Account</p>
    <div class="settings-group">
      <a href="/personal-info.html" class="settings-row"><span class="row-label">Personal Information</span><svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></a>
      <button type="button" class="settings-row" id="changePasswordBtn"><span class="row-label">Change Password</span><svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <p class="settings-section-label">Privacy & Location</p>
    <div class="settings-group">
      <button type="button" class="settings-row" id="locationRow">
        <span class="row-label">Location</span>
        <span class="row-value" id="locationValue">Not set</span>
      </button>
      <a href="/notification-settings.html" class="settings-row"><span class="row-label">Notifications</span><svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></a>
    </div>

    <p class="settings-section-label">General</p>
    <div class="settings-group">
      <div class="settings-row" style="cursor:default;"><span class="row-label">Language</span><span class="row-value">English</span></div>
      <a href="/terms.html" class="settings-row"><span class="row-label">Terms of Service</span><svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></a>
      <a href="/privacy.html" class="settings-row"><span class="row-label">Privacy Policy</span><svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></a>
      <a href="/support.html" class="settings-row"><span class="row-label">Help & Support</span><svg class="row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></a>
    </div>

    <p class="settings-section-label">Danger Zone</p>
    <div class="settings-group">
      <button type="button" class="settings-row danger" id="deleteAccountBtn"><span class="row-label">Delete Account</span></button>
    </div>
  </div>

  <!-- Change password modal -->
  <div class="modal-overlay" id="pwModal" style="display:none;">
    <div class="modal-box" role="dialog" aria-modal="true">
      <h2>Change password</h2>
      <div class="error" id="pwError"></div>
      <div class="success" id="pwSuccess"></div>
      <label>Current password</label>
      <input type="password" id="currentPassword">
      <label>New password</label>
      <input type="password" id="newPassword">
      <div class="pw-checklist" id="pwChecklist">
        <span id="pwLength"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>8+ characters</span>
        <span id="pwLetter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>A letter</span>
        <span id="pwNumber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>A number</span>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="cancelPw">Cancel</button>
        <button type="button" id="submitPw">Update password</button>
      </div>
    </div>
  </div>

  <script src="js/categories.js"></script>
  <script>
    let homeUrl = '/dashboard.html';

    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      homeUrl = me.role === 'provider' ? '/provider-dashboard.html' : '/dashboard.html';
      document.getElementById('locationValue').textContent = me.city || me.district || 'Not set';
    })();

    document.getElementById('locationRow').addEventListener('click', () => {
      if (!navigator.geolocation) { showToast('Location isn\u2019t available on this device.', 'error'); return; }
      document.getElementById('locationValue').textContent = 'Locating...';
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        const res = await fetch('/api/me/location', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude, longitude, accuracy })
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.error, 'error'); document.getElementById('locationValue').textContent = 'Not set'; return; }
        document.getElementById('locationValue').textContent = data.city || data.district || 'Set';
        showToast('Location updated.', 'success');
      }, () => {
        showToast('Location permission was denied.', 'error');
        document.getElementById('locationValue').textContent = 'Not set';
      });
    });

    document.getElementById('changePasswordBtn').addEventListener('click', () => {
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('pwError').textContent = '';
      document.getElementById('pwSuccess').textContent = '';
      openModal(document.getElementById('pwModal'));
    });
    document.getElementById('cancelPw').addEventListener('click', () => closeModal(document.getElementById('pwModal')));
    document.getElementById('newPassword').addEventListener('input', (e) => {
      const strength = checkPasswordStrength(e.target.value);
      ['length', 'letter', 'number'].forEach(key => {
        document.getElementById('pw' + key.charAt(0).toUpperCase() + key.slice(1)).classList.toggle('met', strength[key]);
      });
    });
    document.getElementById('submitPw').addEventListener('click', async () => {
      const errorEl = document.getElementById('pwError');
      const res = await fetch('/api/me/password', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          currentPassword: document.getElementById('currentPassword').value,
          newPassword: document.getElementById('newPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) { errorEl.textContent = data.error; return; }
      document.getElementById('pwSuccess').textContent = 'Password changed.';
      showToast('Password changed.', 'success');
      setTimeout(() => closeModal(document.getElementById('pwModal')), 900);
    });

    document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
      if (!confirm('Delete your account permanently? This removes your bookings, messages, and reviews. This cannot be undone.')) return;
      const res = await fetch('/api/me', { method: 'DELETE' });
      if (res.ok) window.location.href = '/index.html';
      else showToast('Something went wrong deleting your account.', 'error');
    });
  </script>
</body>
</html>
