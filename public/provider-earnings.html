<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earnings — HandyLink Pro</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body has-bottom-nav">
  <div class="app-shell">
    <nav class="sidebar-nav">
      <a href="/provider-dashboard.html" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo"><span class="pro-badge">PRO</span></a>
      <a href="/provider-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/></svg>Jobs</a>
      <a href="/provider-my-jobs.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>My Jobs</a>
      <a href="/provider-earnings.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Earnings</a>
      <a href="/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>Messages</a>
      <a href="/provider-profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
    </nav>

    <div class="app-main">
      <div class="dash-wrap">
        <header class="dash-header">
          <h1 style="font-size:1.4rem; font-weight:800; margin:0;">Earnings</h1>
          <div class="dash-user" style="position:relative;">
            <button class="bell-btn" id="bellBtn" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              <span class="bell-dot" id="bellDot" style="display:none;"></span>
            </button>
            <div id="notifPanel" class="search-suggestions" style="display:none; right:0; left:auto; width:300px; max-width:80vw;"></div>
          </div>
        </header>
        <p class="job-meta" style="margin-bottom:1.5rem;">Estimated from completed jobs — not a real payment record yet.</p>

        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-value" id="statTotal">UGX 0</span>
            <span class="stat-label">Total estimated</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="statCount">0</span>
            <span class="stat-label">Completed jobs</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="statRating">—</span>
            <span class="stat-label">Average rating</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="statReliability">—</span>
            <span class="stat-label">Reliability score</span>
          </div>
        </div>

        <h2 class="section-title" style="margin-top:0;">Recent completed jobs</h2>
        <div id="recentList" class="stagger"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/provider-dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h8"/></svg>Jobs</a>
    <a href="/provider-my-jobs.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>My Jobs</a>
    <a href="/provider-earnings.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Earnings</a>
    <a href="/messages.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-1.1 4.2L21 20l-4.3-1.1a8.4 8.4 0 1 1 4.3-7.4z"/></svg>Messages</a>
    <a href="/provider-profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>

  <script src="js/categories.js"></script>
  <script>
    (async () => {
      const meRes = await fetch('/api/me');
      if (!meRes.ok) { window.location.href = '/login.html'; return; }
      const me = await meRes.json();
      if (me.role !== 'provider') { window.location.href = '/dashboard.html'; return; }
      const refreshNotifications = initNotificationBell();
      setInterval(() => refreshNotifications(), 20000);
      refreshOnResume(() => refreshNotifications());

      const res = await fetch('/api/provider/earnings');
      if (!res.ok) return;
      const data = await res.json();

      animateCount(document.getElementById('statTotal'), data.totalEstimated, { prefix: 'UGX ' });
      animateCount(document.getElementById('statCount'), data.completedCount);
      document.getElementById('statRating').textContent = data.rating ? `★ ${data.rating}` : '—';

      const relRes = await fetch('/api/provider/reliability');
      if (relRes.ok) {
        const relData = await relRes.json();
        if (relData && relData.score != null) {
          animateCount(document.getElementById('statReliability'), relData.score, { suffix: '/100' });
        }
      }

      const list = document.getElementById('recentList');
      if (data.recent.length === 0) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l2-3h14l2 3M3 7v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M3 7h18M9 11h6"/></svg><strong>No completed jobs yet</strong>They'll show up here once you finish your first one.</div>`;
        return;
      }
      data.recent.forEach(j => {
        const color = categoryColor(j.category);
        const item = document.createElement('div');
        item.className = 'job-card fade-in-up';
        item.style.setProperty('--cat-color', color);
        item.innerHTML = `
          <div class="job-top">
            <div>
              <strong>${escapeHtml(j.category)} — ${escapeHtml(j.client_email)}</strong>
              <p class="job-meta">${new Date(j.updated_at).toLocaleDateString()}</p>
            </div>
            <span class="amount" style="font-weight:700;">UGX ${j.estimate_amount.toLocaleString()}</span>
          </div>
          ${j.review_rating ? `<p class="job-meta"><span style="color:var(--warning);">${'★'.repeat(j.review_rating)}${'☆'.repeat(5 - j.review_rating)}</span></p>${j.review_comment ? `<p class="job-desc">"${escapeHtml(j.review_comment)}"</p>` : ''}` : `<p class="job-meta">Not rated yet</p>`}
        `;
        list.appendChild(item);
      });
    })();
  </script>
</body>
</html>
