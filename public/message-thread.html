<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversation — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="dash-wrap" style="max-width:640px;">
    <div class="chat-header">
      <a href="/messages.html" class="chat-back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div class="avatar" id="otherAvatar" style="width:40px; height:40px; flex-shrink:0;"></div>
      <div>
        <h1 id="otherPartyName">Conversation</h1>
        <span id="jobCategory"></span>
        <span id="presenceStatus" class="job-meta" style="display:block;"></span>
      </div>
    </div>

    <div class="chat-thread" id="chatThread"></div>

    <div class="error" id="error"></div>
    <div id="attachPreview" style="display:none; padding:0.5rem 1rem; align-items:center; gap:0.6rem;">
      <img id="attachThumb" alt="" style="width:48px; height:48px; border-radius:8px; object-fit:cover;">
      <span class="job-meta" style="flex:1;">Image ready to send</span>
      <button type="button" id="attachRemove" class="small-btn btn-outline" style="width:auto; padding:0.3rem 0.6rem; font-size:0.75rem;">Remove</button>
    </div>
    <form id="messageForm" class="chat-input-row">
      <button type="button" id="attachBtn" class="chat-back" style="margin:0;" aria-label="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19l-9.2 9.19a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"/></svg>
      </button>
      <input type="file" id="attachInput" accept="image/*" style="display:none;">
      <input type="text" id="messageInput" placeholder="Type a message..." maxlength="2000" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="js/categories.js"></script>
  <script>
    const jobId = new URLSearchParams(window.location.search).get('jobId');
    let myUserEmail = null;
    let pollTimer = null;

    if (!jobId) {
      document.getElementById('error').textContent = 'No conversation selected.';
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function loadThread(scrollToBottom) {
      const res = await fetch(`/api/messages/${jobId}`);
      if (!res.ok) {
        clearInterval(pollTimer);
        document.getElementById('error').textContent = 'This conversation could not be loaded.';
        return;
      }
      const data = await res.json();
      document.getElementById('otherPartyName').textContent = data.job.otherPartyName;
      document.getElementById('jobCategory').textContent = data.job.category;
      document.getElementById('otherAvatar').innerHTML = data.job.otherPartyPhoto
        ? `<img class="avatar-img" src="${data.job.otherPartyPhoto}" alt="">`
        : initials(data.job.otherPartyName);

      const presenceEl = document.getElementById('presenceStatus');
      if (data.job.otherPartyLastActive) {
        const secondsAgo = (Date.now() - new Date(data.job.otherPartyLastActive).getTime()) / 1000;
        if (secondsAgo < 90) {
          presenceEl.innerHTML = '<span style="color:var(--primary); font-weight:600;">● Online</span>';
        } else {
          presenceEl.textContent = `Last seen ${relativeTime(data.job.otherPartyLastActive)}`;
        }
      } else {
        presenceEl.textContent = '';
      }

      const thread = document.getElementById('chatThread');
      thread.innerHTML = '';

      if (data.messages.length === 0) {
        thread.innerHTML = `<div class="empty-state" style="padding:1.5rem;"><strong>Say hello</strong>Start the conversation about this job.</div>`;
      }

      let lastMineIndex = -1;
      data.messages.forEach((m, i) => {
        if (m.sender_user_id === window.currentUserId) lastMineIndex = i;
      });

      let lastDateLabel = null;
      data.messages.forEach((m, i) => {
        const dateLabel = new Date(m.created_at).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
        if (dateLabel !== lastDateLabel) {
          const divider = document.createElement('div');
          divider.style.cssText = 'text-align:center; font-size:0.75rem; color:var(--ink-soft); margin:0.5rem 0;';
          divider.textContent = dateLabel;
          thread.appendChild(divider);
          lastDateLabel = dateLabel;
        }
        const mine = m.sender_user_id === window.currentUserId;
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble ' + (mine ? 'mine' : 'theirs');
        let receipt = '';
        if (mine) {
          // WhatsApp convention: one tick sent, two grey delivered, two
          // blue read. Shown on every sent message rather than only the
          // last — WhatsApp does the same, and it's how you tell which
          // specific message got read.
          const single = '<path d="M1 7.5 4.2 11 11 3.2"/>';
          const double = '<path d="M1 7.5 4.2 11 11 3.2"/><path d="M6 7.5 9.2 11 16 3.2"/>';
          const cls = m.read_at ? 'tick read' : 'tick';
          const paths = (m.read_at || m.delivered_at) ? double : single;
          receipt = ` <svg class="${cls}" viewBox="0 0 17 14" fill="none" stroke="currentColor" stroke-width="1.9">${paths}</svg>`;
        }
        const attachmentHtml = m.attachment
          ? `<img src="${m.attachment}" alt="Attachment" class="chat-attachment" style="max-width:220px; width:100%; border-radius:12px; display:block; margin-bottom:${m.body ? '0.4rem' : '0'}; cursor:pointer;">`
          : '';
        bubble.innerHTML = `${attachmentHtml}${escapeHtml(m.body || '')}<time>${formatTime(m.created_at)}${receipt}</time>`;
        const img = bubble.querySelector('.chat-attachment');
        if (img) img.addEventListener('click', () => window.open(m.attachment, '_blank'));
        thread.appendChild(bubble);
      });

      if (scrollToBottom) thread.scrollTop = thread.scrollHeight;
    }

    let pendingAttachment = null;

    document.getElementById('attachBtn').addEventListener('click', () => {
      document.getElementById('attachInput').click();
    });
    document.getElementById('attachInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        // Compressed before upload — a raw phone photo would be several
        // megabytes and slow on Ugandan mobile data.
        pendingAttachment = await compressImageFile(file, 1000, 0.7);
        document.getElementById('attachThumb').src = pendingAttachment;
        document.getElementById('attachPreview').style.display = 'flex';
      } catch (err) {
        document.getElementById('error').textContent = err.message || 'Couldn\u2019t attach that image.';
      }
      e.target.value = ''; // allow re-picking the same file
    });
    document.getElementById('attachRemove').addEventListener('click', () => {
      pendingAttachment = null;
      document.getElementById('attachPreview').style.display = 'none';
    });

    document.getElementById('messageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const body = input.value.trim();
      // An image on its own is a valid message.
      if (!body && !pendingAttachment) return;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const res = await fetch(`/api/messages/${jobId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body, attachment: pendingAttachment })
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }
      input.value = '';
      pendingAttachment = null;
      document.getElementById('attachPreview').style.display = 'none';
      await loadThread(true);
    });

    (async () => {
      const meRes = await fetch('/api/me');
      if (!meRes.ok) { window.location.href = '/login.html'; return; }
      if (!jobId) return;
      const me = await meRes.json();
      window.currentUserId = me.id;

      await loadThread(true);
      pollTimer = setInterval(() => loadThread(false), 4000);
      refreshOnResume(() => loadThread(false));
    })();

    window.addEventListener('beforeunload', () => clearInterval(pollTimer));
  </script>
</body>
</html>
