<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="dash-wrap" style="max-width:640px;">
    <div class="chat-header">
      <a href="/messages.html" class="chat-back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div>
        <h1 id="otherPartyName">Conversation</h1>
        <span id="jobCategory"></span>
      </div>
    </div>

    <div class="chat-thread" id="chatThread"></div>

    <div class="error" id="error"></div>
    <form id="messageForm" class="chat-input-row">
      <input type="text" id="messageInput" placeholder="Type a message..." maxlength="2000" required autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="js/categories.js"></script>
  <script>
    const jobId = new URLSearchParams(window.location.search).get('jobId');
    let myUserEmail = null;
    let pollTimer = null;

    if (!jobId) {
      document.getElementById('error').textContent = 'No conversation selected.';
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function loadThread(scrollToBottom) {
      const res = await fetch(`/api/messages/${jobId}`);
      if (!res.ok) {
        clearInterval(pollTimer);
        document.getElementById('error').textContent = 'This conversation could not be loaded.';
        return;
      }
      const data = await res.json();
      document.getElementById('otherPartyName').textContent = data.job.otherPartyName;
      document.getElementById('jobCategory').textContent = data.job.category;

      const thread = document.getElementById('chatThread');
      thread.innerHTML = '';

      if (data.messages.length === 0) {
        thread.innerHTML = `<div class="empty-state" style="padding:1.5rem;"><strong>Say hello</strong>Start the conversation about this job.</div>`;
      }

      data.messages.forEach(m => {
        const mine = m.sender_user_id === window.currentUserId;
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble ' + (mine ? 'mine' : 'theirs');
        bubble.innerHTML = `${escapeHtml(m.body)}<time>${formatTime(m.created_at)}</time>`;
        thread.appendChild(bubble);
      });

      if (scrollToBottom) thread.scrollTop = thread.scrollHeight;
    }

    document.getElementById('messageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const body = input.value.trim();
      if (!body) return;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const res = await fetch(`/api/messages/${jobId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body })
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }
      input.value = '';
      await loadThread(true);
    });

    (async () => {
      const meRes = await fetch('/api/me');
      if (!meRes.ok) { window.location.href = '/login.html'; return; }
      if (!jobId) return;
      const me = await meRes.json();
      window.currentUserId = me.id;

      await loadThread(true);
      pollTimer = setInterval(() => loadThread(false), 4000);
    })();

    window.addEventListener('beforeunload', () => clearInterval(pollTimer));
  </script>
</body>
</html>
