<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Professional — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="dash-wrap" style="max-width:560px; padding-top:calc(1.5rem + env(safe-area-inset-top));">
    <button type="button" class="chat-back" style="margin-bottom:1rem;" aria-label="Back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div id="content"></div>
  </div>

  <script src="js/categories.js"></script>
  <script>
    const providerId = new URLSearchParams(window.location.search).get('id');

    async function load() {
      const el = document.getElementById('content');
      el.innerHTML = `<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>`;

      if (!providerId) { el.innerHTML = errorStateHtml(''); return; }
      const res = await fetch(`/api/providers/${providerId}/public`);
      if (!res.ok) {
        el.innerHTML = `<div class="empty-state"><strong>Professional not found</strong>They may no longer be available.</div>`;
        return;
      }
      const { provider: p, reviews, services, portfolio } = await res.json();

      const avail = { available_now: 'Available now', available_today: 'Available today', available_later: 'Available later', not_available: 'Not available' }[p.availability_status] || '';

      el.innerHTML = `
        <div class="settings-avatar-block">
          <div class="avatar" style="width:84px; height:84px; margin:0 auto 0.75rem;">
            ${p.photo ? `<img class="avatar-img" src="${p.photo}" alt="">` : escapeHtml(initials(p.name))}
          </div>
          <strong style="font-size:1.2rem; display:block;">${escapeHtml(p.name)}</strong>
          <span class="job-meta">${escapeHtml(p.category)}${p.city ? ' · ' + escapeHtml(p.city) : ''}</span>
          <div style="display:flex; gap:0.4rem; justify-content:center; flex-wrap:wrap; margin-top:0.6rem;">
            ${p.rating ? `<span class="verif-badge" style="color:var(--warning); background:#FEF3C7;">★ ${p.rating}</span>` : ''}
            <span class="user-role-pill">${p.completed_jobs} job${p.completed_jobs === 1 ? '' : 's'} done</span>
            ${avail ? `<span class="verif-badge" style="color:var(--primary-deep); background:var(--primary-tint);">${avail}</span>` : ''}
          </div>
        </div>

        ${p.bio ? `<div class="job-card"><p class="job-desc" style="margin:0;">${escapeHtml(p.bio)}</p></div>` : ''}

        <p class="settings-section-label">Verification</p>
        <div class="settings-group">
          <div class="settings-row" style="cursor:default;">
            <span class="row-label">Identity</span>
            <span class="row-value">${p.identity_status === 'VERIFIED' ? '✓ Verified' : 'Not verified'}</span>
          </div>
          <div class="settings-row" style="cursor:default;">
            <span class="row-label">Phone</span>
            <span class="row-value">${p.phone_status === 'VERIFIED' ? '✓ Verified' : 'Not verified'}</span>
          </div>
        </div>

        ${services.length ? `
          <p class="settings-section-label">Services</p>
          <div style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:1.5rem;">
            ${services.map(s => `<span class="verif-badge" style="color:${s.verification_status === 'VERIFIED' ? 'var(--primary-deep)' : 'var(--ink-soft)'}; background:${s.verification_status === 'VERIFIED' ? 'var(--primary-tint)' : 'var(--surface)'};">${escapeHtml(s.name)}${s.verification_status === 'VERIFIED' ? ' ✓' : ''}</span>`).join('')}
          </div>` : ''}

        ${(p.hourly_rate || p.callout_fee || p.minimum_charge) ? `
          <p class="settings-section-label">Pricing</p>
          <div class="settings-group">
            ${p.hourly_rate ? `<div class="settings-row" style="cursor:default;"><span class="row-label">Hourly rate</span><span class="row-value">UGX ${p.hourly_rate.toLocaleString()}</span></div>` : ''}
            ${p.callout_fee ? `<div class="settings-row" style="cursor:default;"><span class="row-label">Call-out fee</span><span class="row-value">UGX ${p.callout_fee.toLocaleString()}</span></div>` : ''}
            ${p.minimum_charge ? `<div class="settings-row" style="cursor:default;"><span class="row-label">Minimum charge</span><span class="row-value">UGX ${p.minimum_charge.toLocaleString()}</span></div>` : ''}
          </div>
          <p class="job-meta" style="margin-bottom:1.5rem;">Indicative rates — the final price is agreed with you before work starts.</p>` : ''}

        ${portfolio.length ? `
          <p class="settings-section-label">Past work</p>
          <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:0.6rem; margin-bottom:1.5rem;">
            ${portfolio.map(item => `
              <div style="background:var(--bg); border-radius:var(--radius-sm); overflow:hidden; box-shadow:var(--shadow-sm);">
                <img src="${item.photo}" alt="" style="width:100%; height:110px; object-fit:cover; display:block;">
                ${item.job_type ? `<div style="padding:0.5rem 0.6rem;"><strong style="font-size:0.78rem;">${escapeHtml(item.job_type)}</strong></div>` : ''}
              </div>`).join('')}
          </div>` : ''}

        <p class="settings-section-label">Reviews${reviews.length ? ` (${reviews.length})` : ''}</p>
        ${reviews.length === 0
          ? `<div class="empty-state"><strong>No reviews yet</strong>This pro hasn't been reviewed yet.</div>`
          : reviews.map(r => `
              <div class="job-card">
                <div class="job-top">
                  <div><strong>${escapeHtml(r.reviewer_name || 'Client')}</strong>
                  <p class="job-meta">${new Date(r.created_at).toLocaleDateString()}</p></div>
                  <span class="verif-badge" style="color:var(--warning); background:#FEF3C7;">★ ${r.rating}</span>
                </div>
                ${r.comment ? `<p class="job-desc">${escapeHtml(r.comment)}</p>` : ''}
              </div>`).join('')}
      `;
    }

    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      await load();
    })();
  </script>
</body>
</html>
