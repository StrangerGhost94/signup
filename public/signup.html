<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign up — Handy</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="card">
    <div class="card-accent"></div>
    <div class="card-body">
      <span class="wordmark">HANDY</span>
      <h1>Create your account</h1>
      <p class="subtext">Start finding trusted help near you.</p>
      <div class="error" id="error"></div>
      <form id="signupForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password (min 6 characters)" required>
        <button type="submit" class="btn-primary">Sign up</button>
      </form>
      <p class="switch">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }
      window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
