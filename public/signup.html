<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="card card-wide">
    <div class="card-body">
      <a href="/login.html" class="back-arrow" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>

      <h1 style="margin-top:0;">Create your account</h1>
      <p class="subtext">Choose how you'll use HandyLink</p>

      <a href="/signup-customer.html" class="big-choice-card active-choice">
        <div class="big-choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </div>
        <div class="big-choice-text">
          <strong>I'm a Customer</strong>
          <span>I need help with home services and repairs.</span>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>

      <a href="/signup-worker.html" class="big-choice-card">
        <div class="big-choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.66 5.66L4 17l3 3 5.04-5.04a4 4 0 0 0 5.66-5.66l-2.12 2.12-2.12-.7-.7-2.12 2.12-2.12z"/></svg>
        </div>
        <div class="big-choice-text">
          <strong>I'm a Handyman</strong>
          <span>I provide services and want to get jobs.</span>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>

      <p class="switch">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>
</body>
</html>
