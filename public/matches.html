<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a pro — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="dash-wrap">
    <a href="/request.html" class="back-link" style="color:var(--ink-soft); font-size:0.88rem; font-weight:600; display:inline-block; margin-bottom:1rem;" id="backLink">← Back</a>
    <h1 id="pageTitle" style="font-size:1.35rem; margin:0 0 0.75rem;"></h1>

    <div class="estimate-banner" id="estimateBanner"></div>
    <div id="highRiskNote" style="display:none; background:#FEF3C7; color:#92400E; border-radius:var(--radius-sm); padding:0.75rem 1rem; margin-bottom:1rem; font-size:0.85rem;">
      This is a higher-risk service — only pros verified specifically for it are shown here.
    </div>

    <div class="filters" id="sortBar" style="margin-bottom:0.75rem;"></div>
    <p class="status-line" id="statusLine"></p>
    <div class="worker-grid stagger" id="workerGrid"></div>
  </div>

  <div class="modal-overlay" id="confirmModal" style="display:none;">
    <div class="modal-box" role="dialog" aria-modal="true">
      <h2>Confirm booking</h2>
      <div id="confirmSummary"></div>
      <div class="error" id="confirmError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="cancelBooking">Cancel</button>
        <button type="button" id="confirmBooking">Confirm booking</button>
      </div>
    </div>
  </div>

  <script src="js/categories.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const category = params.get('category');
    const pendingJob = JSON.parse(sessionStorage.getItem('pendingJob') || 'null');

    if (!pendingJob || pendingJob.category !== category) {
      window.location.href = `/request.html?category=${encodeURIComponent(category || '')}`;
    }

    document.getElementById('backLink').href = `/request.html?category=${encodeURIComponent(category)}`;
    document.getElementById('pageTitle').textContent = `${category} pros near you`;

    const hasAiEstimate = pendingJob && pendingJob.estimateMin != null && pendingJob.estimateMax != null;
    const estimate = hasAiEstimate
      ? `${pendingJob.estimateMin.toLocaleString()} – ${pendingJob.estimateMax.toLocaleString()}`
      : (CATEGORY_ESTIMATES[category] || '20,000 – 100,000');
    document.getElementById('estimateBanner').innerHTML = `
      <span class="amount">UGX ${estimate}</span>
      <p>${hasAiEstimate ? 'Based on your job description' : `Estimated cost based on similar ${escapeHtml((category || '').toLowerCase())} jobs`}. Final price is confirmed with the pro directly.</p>
    `;

    let chosenProvider = null;
    let myLat = null;
    let myLng = null;
    let activeSort = 'recommended';

    function captureMyLocation() {
      return new Promise((resolve) => {
        window.promptForLocation((lat, lng) => {
          myLat = lat;
          myLng = lng;
          resolve();
        });
      });
    }

    let lastFetchedWorkers = [];

    const HIGH_RISK_SERVICES = ['Electrical', 'Mechanical'];
    if (HIGH_RISK_SERVICES.includes(category)) {
      document.getElementById('highRiskNote').style.display = 'block';
    }

    const SORT_OPTIONS = [
      ['recommended', 'Recommended'],
      ['nearest', 'Nearest'],
      ['rated', 'Top Rated'],
      ['price', 'Lowest Price'],
      ['available', 'Fastest Available']
    ];
    document.getElementById('sortBar').innerHTML = SORT_OPTIONS.map(([val, label], i) =>
      `<a href="#" data-sort="${val}" class="filter-btn${i === 0 ? ' active' : ''}">${label}</a>`
    ).join('');
    document.querySelectorAll('#sortBar a').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('#sortBar a').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        activeSort = a.dataset.sort;
        applySort();
      });
    });

    function applySort() {
      // The eligibility (hard filters) never changes with sort — only the
      // order does. "Recommended" keeps the matching engine's own order.
      let sorted = [...lastFetchedWorkers];
      if (activeSort === 'nearest') {
        sorted.sort((a, b) => (a.distanceKm ?? Infinity) - (b.distanceKm ?? Infinity));
      } else if (activeSort === 'rated') {
        sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      } else if (activeSort === 'price') {
        const priceOf = w => w.hourly_rate || w.callout_fee || Infinity;
        sorted.sort((a, b) => priceOf(a) - priceOf(b));
      } else if (activeSort === 'available') {
        const rank = { available_now: 0, available_today: 1, available_later: 2, not_available: 3 };
        sorted.sort((a, b) => (rank[a.availability_status] ?? 9) - (rank[b.availability_status] ?? 9));
      }
      renderMatches(sorted);
    }

    async function loadMatches() {
      document.getElementById('statusLine').textContent = 'Finding pros…';

      captureMyLocation().then(() => {
        if (myLat !== null) fetchCandidates(); // re-fetch with real distance once resolved
      });

      await fetchCandidates();
    }

    async function fetchCandidates() {
      const params = new URLSearchParams({ category });
      if (myLat !== null) { params.set('lat', myLat); params.set('lng', myLng); }
      if (pendingJob?.urgency) params.set('urgency', pendingJob.urgency);
      if (pendingJob?.estimateMin != null) { params.set('estimateMin', pendingJob.estimateMin); params.set('estimateMax', pendingJob.estimateMax); }

      const res = await fetch('/api/matching/candidates?' + params.toString());
      if (!res.ok) {
        // Fall back to the plain browse list if the matching engine call
        // fails for any reason — the marketplace still has to work.
        const fallbackRes = await fetch('/api/workers?category=' + encodeURIComponent(category));
        const fallbackData = await fallbackRes.json();
        lastFetchedWorkers = HIGH_RISK_SERVICES.includes(category) ? fallbackData.workers.filter(w => w.category_verified) : fallbackData.workers;
        applySort();
        return;
      }
      const data = await res.json();
      lastFetchedWorkers = data.candidates;
      applySort();
    }

    function renderMatches(workers) {
      const grid = document.getElementById('workerGrid');
      const statusLine = document.getElementById('statusLine');
      grid.innerHTML = '';

      if (workers.length === 0) {
        statusLine.textContent = '';
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l2-3h14l2 3M3 7v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M3 7h18M9 11h6"/></svg><strong>No pros in this category yet</strong>Try a different category or check back soon.</div>`;
        return;
      }

      statusLine.textContent = `${workers.length} pro${workers.length === 1 ? '' : 's'} available${myLat !== null ? ' · nearest first' : ''}`;

      workers.forEach(w => {
        const color = categoryColor(w.category);
        const card = document.createElement('div');
        card.className = 'worker-card' + (w.matchLabel === 'Best Match' ? ' top-match' : '');
        card.style.setProperty('--cat-color', color);
        const distanceLabel = (w.distanceKm !== null && w.distanceKm !== undefined) ? `${w.distanceKm.toFixed(1)} km away` : null;
        const AVAILABILITY_LABELS = { available_now: '● Available now', available_today: 'Available today', available_later: 'Available later', not_available: 'Not currently available' };
        const availabilityLabel = AVAILABILITY_LABELS[w.availability_status];
        const jobsCount = (w.similar_jobs != null && w.similar_jobs > 0) ? w.similar_jobs : w.completed_jobs;
        const jobsLabel = (w.similar_jobs != null && w.similar_jobs > 0) ? `similar ${w.category.toLowerCase()} job${w.similar_jobs === 1 ? '' : 's'}` : 'jobs completed';
        card.innerHTML = `
          <div class="worker-head">
            <div class="avatar">${w.photo ? `<img class="avatar-img" src="${w.photo}" alt="">` : initials(w.name)}</div>
            <div class="worker-name-block">
              <strong>${escapeHtml(w.name)}</strong>
              <span class="worker-cat"><svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2">${categoryIcon(w.category)}</svg>${escapeHtml(w.category)}</span>
            </div>
            <span class="rating"><span class="star">★</span> ${w.rating}</span>
          </div>
          ${w.matchLabel ? `<span class="trust-badge trust-badge-primary" style="margin-bottom:0.5rem;">${escapeHtml(w.matchLabel)}</span>` : ''}
          ${availabilityLabel ? `<span class="availability-line${w.availability_status === 'available_now' ? ' now' : ''}"><span class="dot"></span>${availabilityLabel}</span>` : ''}
          <p class="location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            ${escapeHtml(w.location)}${distanceLabel ? ` · ${distanceLabel}` : ''}
          </p>
          <p class="trust-meta-line">${jobsCount || 0} ${jobsLabel}${w.experience_years != null ? ` · ${w.experience_years} yrs experience` : ''}</p>
          ${w.specialties && w.specialties.length ? `<div class="specialty-chips">${w.specialties.slice(0, 4).map(s => `<span class="specialty-chip">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
          ${renderTrustBadges(w)}
          ${w.whyRecommended ? `<p class="job-meta" style="font-style:italic; margin-bottom:0.5rem;">${escapeHtml(w.whyRecommended)}</p>` : ''}
          <p class="bio">${escapeHtml(w.bio)}</p>

          <button class="small-btn" data-id="${w.id}" data-name="${escapeHtml(w.name)}">Book ${escapeHtml(w.name.split(' ')[0])}</button>
        `;
        card.querySelector('button').addEventListener('click', () => openConfirm(w));
        grid.appendChild(card);
      });
    }

    function openConfirm(provider) {
      chosenProvider = provider;
      const urgencyMeta = URGENCY_OPTIONS.find(u => u.value === pendingJob.urgency);
      document.getElementById('confirmSummary').innerHTML = `
        <div class="modal-row"><span>Pro</span><span>${escapeHtml(provider.name)}</span></div>
        <div class="modal-row"><span>Category</span><span>${escapeHtml(category)}</span></div>
        <div class="modal-row"><span>When</span><span>${urgencyMeta ? urgencyMeta.label : escapeHtml(pendingJob.urgency)}</span></div>
        <div class="modal-row"><span>Location</span><span>${escapeHtml(pendingJob.location)}</span></div>
        <div class="modal-row"><span>Estimate</span><span>UGX ${estimate}</span></div>
        ${renderTrustBadges(provider)}
      `;
      document.getElementById('confirmError').textContent = '';
      openModal(document.getElementById('confirmModal'));
    }

    document.getElementById('cancelBooking').addEventListener('click', () => {
      closeModal(document.getElementById('confirmModal'));
    });

    document.getElementById('confirmBooking').addEventListener('click', async () => {
      const errorEl = document.getElementById('confirmError');
      errorEl.textContent = '';

      const res = await fetch('/api/bookings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          providerId: chosenProvider.id,
          category,
          description: pendingJob.description,
          urgency: pendingJob.urgency,
          location: pendingJob.location,
          locationNotes: pendingJob.locationNotes,
          assessmentId: pendingJob.assessmentId
        })
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }

      sessionStorage.removeItem('pendingJob');
      window.location.href = '/dashboard.html?booked=1';
    });

    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const me = await res.json();
      if (me.role !== 'client') { window.location.href = '/provider-dashboard.html'; return; }
      await loadMatches();
    })();
  </script>
</body>
</html>
