<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — HandyLink</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="card">
    <div class="card-body">
      <a href="/index.html" class="brand"><img src="images/logo.svg" alt="HandyLink" class="brand-logo"></a>

      <h1>Set a new password</h1>
      <p class="subtext" id="subtext">Choose a new password for your account.</p>

      <div class="error" id="error"></div>

      <form id="resetForm">
        <div class="input-icon-wrap">
          <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="10" width="15" height="10.5" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="14.8" r="1.3" fill="currentColor" stroke="none"/><path d="M12 16.1v1.6" stroke-width="2"/></svg>
          <input type="password" id="password" placeholder="New password" required>
          <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="pw-checklist" id="pwChecklist">
          <span id="pwLength"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>8+ characters</span>
          <span id="pwLetter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>A letter</span>
          <span id="pwNumber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>A number</span>
        </div>

        <button type="submit" id="submitBtn">Update password</button>
      </form>

      <p class="switch">Back to <a href="/login.html">sign in</a></p>
    </div>
  </div>

  <script src="js/categories.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('error').textContent = 'This reset link is missing its token. Please request a new one from the login page.';
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('eyeToggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('password').addEventListener('input', (e) => {
      const strength = checkPasswordStrength(e.target.value);
      ['length', 'letter', 'number'].forEach(key => {
        document.getElementById('pw' + key.charAt(0).toUpperCase() + key.slice(1)).classList.toggle('met', strength[key]);
      });
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: document.getElementById('password').value })
      });
      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.error;
        return;
      }

      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('subtext').textContent = 'Password updated — redirecting you to sign in...';
      setTimeout(() => { window.location.href = '/login.html'; }, 1500);
    });
  </script>
</body>
</html>
